<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>ArjunaFit · Nueva contraseña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0c0714;--card:#130d22;--input-bg:#1f1438;
  --primary:#7c3aed;--primary-l:#c4b5fd;--accent:#ec4899;
  --success:#10b981;--danger:#ef4444;
  --text:#f1f0f4;--text2:#c4b5fd;--text3:#7c6fa0;--muted:#3d3258;
  --border:rgba(124,58,237,0.2);--subtle:rgba(255,255,255,0.06);
  --font:'Outfit',sans-serif;--max-w:430px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  min-height:100%;background:var(--bg);color:var(--text);
  font-family:var(--font);-webkit-font-smoothing:antialiased;
}
.bg-glow{
  position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 50% at 50% -10%,rgba(124,58,237,0.25),transparent);
}
.page{
  max-width:var(--max-w);margin:0 auto;min-height:100dvh;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.content{
  position:relative;z-index:1;flex:1;
  display:flex;flex-direction:column;justify-content:center;
  padding:32px 24px;
}
.logo-wrap{text-align:center;margin-bottom:32px}
.logo-icon{font-size:44px;display:block;margin-bottom:8px;
  filter:drop-shadow(0 0 20px rgba(124,58,237,0.6));
  animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.logo-name{font-size:26px;font-weight:900;letter-spacing:-0.04em}
.logo-name span{
  background:linear-gradient(135deg,var(--primary-l),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent
}

.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:24px;padding:28px 24px;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
}
.card-title{font-size:20px;font-weight:800;letter-spacing:-0.03em;margin-bottom:4px}
.card-sub{font-size:13px;color:var(--text3);margin-bottom:24px}

.field{margin-bottom:14px}
.field-label{font-size:11px;font-weight:700;letter-spacing:0.06em;
  text-transform:uppercase;color:var(--text3);margin-bottom:6px;display:block}
.input-wrap{
  position:relative;display:flex;align-items:center;
  background:var(--input-bg);border:1.5px solid var(--subtle);
  border-radius:14px;transition:border-color 0.2s;
}
.input-wrap:focus-within{border-color:rgba(124,58,237,0.5)}
.input-icon{padding:0 12px;font-size:16px;flex-shrink:0;pointer-events:none;opacity:0.6}
.field-input{
  flex:1;background:none;border:none;outline:none;
  font-family:var(--font);font-size:15px;font-weight:400;
  color:var(--text);padding:13px 0;-webkit-appearance:none;
}
.field-input::placeholder{color:var(--muted)}
.pass-toggle{
  padding:0 14px;font-size:16px;cursor:pointer;
  background:none;border:none;color:var(--text3);transition:color 0.2s;flex-shrink:0;
}
.pass-toggle:hover{color:var(--text2)}

/* Strength bar */
.strength-wrap{margin-top:8px;display:none}
.strength-wrap.show{display:block}
.strength-bar{height:4px;background:var(--muted);border-radius:2px;overflow:hidden}
.strength-fill{height:100%;border-radius:2px;width:0;transition:width 0.3s,background 0.3s}
.strength-label{font-size:11px;margin-top:4px;font-weight:600}

.msg-box{
  padding:12px 14px;border-radius:12px;
  font-size:13px;font-weight:500;line-height:1.5;
  margin-bottom:14px;display:none;
}
.msg-box.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:#fca5a5;display:block}
.msg-box.success{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);color:#6ee7b7;display:block}
.msg-box.info{background:rgba(124,58,237,0.1);border:1px solid rgba(124,58,237,0.25);color:var(--primary-l);display:block}

.btn-submit{
  width:100%;padding:15px;border-radius:16px;border:none;
  background:linear-gradient(135deg,var(--primary),#9333ea);
  color:white;font-family:var(--font);font-size:16px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform 0.15s,opacity 0.15s;
  box-shadow:0 4px 20px rgba(124,58,237,0.4);
  position:relative;overflow:hidden;
}
.btn-submit::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.08),transparent)}
.btn-submit:active{transform:scale(0.97)}
.btn-submit:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-spinner{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);
  border-top-color:white;animation:spin 0.7s linear infinite;display:none;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* Estado: esperando token / expirado */
.state-panel{display:none;text-align:center;padding:16px 0}
.state-panel.show{display:block}
.form-panel{display:none;flex-direction:column}
.form-panel.show{display:flex}
.state-icon{font-size:48px;margin-bottom:12px;display:block}
.state-title{font-size:18px;font-weight:700;margin-bottom:8px}
.state-sub{font-size:13px;color:var(--text3);line-height:1.6}
.link-btn{
  display:inline-block;margin-top:16px;
  color:var(--primary-l);font-size:14px;font-weight:600;
  text-decoration:none;
}
.link-btn:hover{text-decoration:underline}

/* Loader */
.page-loader{
  position:fixed;inset:0;background:var(--bg);z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  transition:opacity 0.4s,visibility 0.4s;
}
.page-loader.hide{opacity:0;visibility:hidden;pointer-events:none}
</style>
<script src="/js/core/auth-bootstrap.js"></script>
</head>
<body>

<div class="page-loader" id="pageLoader">
  <div style="font-size:44px;animation:float 1.5s ease-in-out infinite">🔐</div>
  <div style="font-size:13px;color:var(--text3);font-weight:600">Verificando link...</div>
</div>

<div class="bg-glow"></div>

<div class="page">
  <div class="content">

    <div class="logo-wrap">
      <span class="logo-icon">🏋️</span>
      <div class="logo-name">Arjuna<span>Fit</span></div>
    </div>

    <div class="card">

      <!-- Estado: esperando / procesando -->
      <div class="state-panel" id="statePanel">
        <span class="state-icon" id="stateIcon">⏳</span>
        <div class="state-title" id="stateTitle">Verificando link...</div>
        <div class="state-sub"  id="stateSub"></div>
        <a href="/" class="link-btn" id="stateLink" style="display:none">Volver al inicio →</a>
      </div>

      <!-- Formulario nueva contraseña -->
      <div class="form-panel" id="formPanel">
        <div class="card-title">Nueva contraseña 🔐</div>
        <div class="card-sub">Elige una contraseña segura</div>

        <div class="msg-box" id="formMsg"></div>

        <form id="resetForm" novalidate>
          <div class="field">
            <label class="field-label" for="newPass">Nueva contraseña</label>
            <div class="input-wrap">
              <span class="input-icon">🔒</span>
              <input class="field-input" id="newPass" type="password"
                     placeholder="Mínimo 8 caracteres" autocomplete="new-password"
                     oninput="checkStrength(this.value)" required>
              <button type="button" class="pass-toggle"
                      onclick="togglePass('newPass',this)" aria-label="Ver contraseña">👁️</button>
            </div>
            <div class="strength-wrap" id="strengthWrap">
              <div class="strength-bar">
                <div class="strength-fill" id="strengthFill"></div>
              </div>
              <div class="strength-label" id="strengthLabel"></div>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="confirmPass">Confirmar contraseña</label>
            <div class="input-wrap">
              <span class="input-icon">🔒</span>
              <input class="field-input" id="confirmPass" type="password"
                     placeholder="Repite la contraseña" autocomplete="new-password" required>
              <button type="button" class="pass-toggle"
                      onclick="togglePass('confirmPass',this)" aria-label="Ver contraseña">👁️</button>
            </div>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            <div class="btn-spinner" id="submitSpinner"></div>
            <span id="submitText">Actualizar contraseña</span>
          </button>
        </form>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/core/supabase-client.js"></script>
<script>
// ══════════════════════════════════════════════════
// RESET PASSWORD
// Supabase envía al usuario aquí con un token/code
// ══════════════════════════════════════════════════

function showState(icon, title, sub, showLink = false) {
  document.getElementById('statePanel').classList.add('show');
  document.getElementById('formPanel').classList.remove('show');
  document.getElementById('stateIcon').textContent  = icon;
  document.getElementById('stateTitle').textContent = title;
  document.getElementById('stateSub').textContent   = sub;
  document.getElementById('stateLink').style.display = showLink ? 'inline-block' : 'none';
}

function showForm() {
  document.getElementById('statePanel').classList.remove('show');
  document.getElementById('formPanel').classList.add('show');
}

function hideLoader() {
  document.getElementById('pageLoader').classList.add('hide');
}

// ── Escuchar evento PASSWORD_RECOVERY de Supabase ──
// Supabase v2 con PKCE: procesa el code automáticamente
// Supabase v2 implicit: procesa el hash automáticamente
// En ambos casos, onAuthStateChange dispara PASSWORD_RECOVERY

sb.auth.onAuthStateChange(async (event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    // Token válido → mostrar formulario
    hideLoader();
    showForm();
  } else if (event === 'SIGNED_IN' && session) {
    // Puede llegar aquí si el link es de tipo email confirmation
    // No redirigir — el usuario necesita cambiar contraseña primero
    hideLoader();
    showForm();
  }
});

// ── Timeout: si en 5s no llega evento → link inválido/expirado ──
setTimeout(() => {
  const loader = document.getElementById('pageLoader');
  if (!loader.classList.contains('hide')) {
    hideLoader();
    showState(
      '⏰',
      'Link expirado o inválido',
      'Los links de recuperación expiran en 1 hora. Solicita uno nuevo.',
      true
    );
  }
}, 5000);

// ── Fuerza procesamiento del hash en carga ─────────
// Necesario en algunos casos con implicit flow
window.addEventListener('load', async () => {
  const hash = window.location.hash;
  const params = new URLSearchParams(window.location.search);

  if (hash.includes('access_token') || hash.includes('type=recovery') || params.has('code')) {
    try {
      // Supabase v2 procesa automáticamente — solo esperar el evento
      // Pero si tarda, forzar verificación de sesión
      const { data } = await sb.auth.getSession();
      if (data?.session) {
        hideLoader();
        showForm();
      }
    } catch (e) {
      console.warn('Session check error:', e);
    }
  } else {
    // No hay token en la URL → redirigir a login
    hideLoader();
    showState(
      '🔗',
      'Link no válido',
      'Accede a esta página desde el link que te enviamos por correo.',
      true
    );
  }
});

// ── Submit nueva contraseña ────────────────────────
document.getElementById('resetForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const newPass     = document.getElementById('newPass').value;
  const confirmPass = document.getElementById('confirmPass').value;
  const msgEl       = document.getElementById('formMsg');

  msgEl.className = 'msg-box';

  // Validaciones
  if (newPass.length < 8) {
    showMsg(msgEl, 'La contraseña debe tener al menos 8 caracteres.', 'error');
    return;
  }
  if (newPass !== confirmPass) {
    showMsg(msgEl, 'Las contraseñas no coinciden.', 'error');
    return;
  }

  setLoading(true);

  try {
    const { error } = await sb.auth.updateUser({ password: newPass });

    if (error) {
      setLoading(false);
      var errMsg = error.message || '';
      var humanMsg = errMsg.includes('Password') || errMsg.includes('least')
        ? 'La contraseña debe tener al menos 8 caracteres.'
        : errMsg.includes('expired') || errMsg.includes('invalid')
        ? 'El enlace expiró. Pide uno nuevo desde el login.'
        : errMsg.includes('network') || errMsg.includes('fetch')
        ? 'Sin conexión. Revisa tu internet e intenta de nuevo.'
        : 'No pudimos guardar la contraseña. Intenta de nuevo.';
      showMsg(msgEl, humanMsg, 'error');
      return;
    }

    // Éxito → cerrar sesión de recovery y redirigir a login
    showMsg(msgEl, '✅ Listo. Ya puedes entrar a ArjunaFit.', 'success');
    await sb.auth.signOut();

    setTimeout(() => {
      window.location.href = '/';
    }, 2000);

  } catch (e) {
    setLoading(false);
    showMsg(msgEl, 'Tu conexión parece inestable. Intenta otra vez.', 'error');
    console.error('Update password error:', e);
  }
});

// ── Helpers ───────────────────────────────────────
function setLoading(on) {
  const btn  = document.getElementById('submitBtn');
  const spin = document.getElementById('submitSpinner');
  const txt  = document.getElementById('submitText');
  btn.disabled = on;
  spin.style.display = on ? 'block' : 'none';
  txt.textContent = on ? 'Actualizando...' : 'Actualizar contraseña';
}

function showMsg(el, msg, type) {
  el.textContent = msg;
  el.className = `msg-box ${type}`;
}

function togglePass(inputId, btn) {
  const input = document.getElementById ? document.getElementById(inputId) : inputId;
  if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
  else { input.type = 'password'; btn.textContent = '👁️'; }
}

function checkStrength(val) {
  const wrap  = document.getElementById('strengthWrap');
  const fill  = document.getElementById('strengthFill');
  const label = document.getElementById('strengthLabel');
  if (!val) { wrap.classList.remove('show'); return; }

  wrap.classList.add('show');
  let score = 0;
  if (val.length >= 8)  score++;
  if (val.length >= 12) score++;
  if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;

  const levels = [
    { w: '20%', color: '#ef4444', text: 'Muy débil' },
    { w: '40%', color: '#f97316', text: 'Débil' },
    { w: '60%', color: '#eab308', text: 'Regular' },
    { w: '80%', color: '#22c55e', text: 'Buena' },
    { w: '100%', color: '#10b981', text: 'Excelente ✓' },
  ];

  const lvl = levels[Math.min(score, 4)];
  fill.style.width      = lvl.w;
  fill.style.background = lvl.color;
  label.textContent     = lvl.text;
  label.style.color     = lvl.color;
}
</script>
</body>
</html>
