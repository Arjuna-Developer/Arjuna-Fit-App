<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="35%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0f0428"/>
      <stop offset="100%" stop-color="#07020f"/>
    </radialGradient>
    <linearGradient id="purp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left: logo area -->
  <circle cx="230" cy="315" r="180" fill="none" stroke="url(#purp)" stroke-width="12" opacity="0.8" filter="url(#glow)"/>
  <circle cx="230" cy="315" r="140" fill="url(#purp)" opacity="0.15"/>
  <!-- AF monogram -->
  <text x="230" y="360" font-family="Georgia,serif" font-weight="700" font-size="130"
    text-anchor="middle" fill="white" opacity="0.95">AF</text>

  <!-- Right: wordmark + tagline -->
  <text x="460" y="240" font-family="Arial,sans-serif" font-weight="800" font-size="88"
    fill="white" letter-spacing="4">ARJUNA</text>
  <text x="464" y="330" font-family="Arial,sans-serif" font-weight="300" font-size="88"
    fill="#a78bfa" letter-spacing="20">FIT</text>

  <!-- Separator line -->
  <line x1="460" y1="358" x2="1140" y2="358" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>

  <!-- Tagline -->
  <text x="460" y="408" font-family="Arial,sans-serif" font-size="30" fill="rgba(255,255,255,0.65)"
    letter-spacing="2">ENTRENA · COME MEJOR · NO ABANDONES</text>

  <!-- Features row -->
  <text x="460" y="490" font-family="Arial,sans-serif" font-size="26" fill="rgba(196,181,253,0.8)">
    🏋️ Retos con 7 días gratis
  </text>
  <text x="460" y="535" font-family="Arial,sans-serif" font-size="26" fill="rgba(196,181,253,0.8)">
    🥗 Nutrición + recetas + Coach IA
  </text>

  <!-- URL badge -->
  <rect x="460" y="568" width="280" height="44" rx="22" fill="rgba(109,40,255,0.4)" stroke="rgba(168,85,247,0.5)" stroke-width="1"/>
  <text x="600" y="596" font-family="Arial,sans-serif" font-size="20" text-anchor="middle"
    fill="white" font-weight="600">arjunafit.com</text>
</svg>