<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#07020f"/>
    </radialGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle grid/texture -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(139,92,246,0.08)" stroke-width="1"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(139,92,246,0.06)" stroke-width="1"/>

  <!-- Outer arc/shield glow -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="url(#arcGrad)" stroke-width="12" stroke-linecap="round"
    stroke-dasharray="900 200" stroke-dashoffset="-80" filter="url(#glow)" opacity="0.9"/>

  <!-- Inner arc -->
  <circle cx="256" cy="256" r="155" fill="none" stroke="rgba(168,85,247,0.25)" stroke-width="2"/>

  <!-- A letter -->
  <text x="256" y="290" 
    font-family="'Georgia', 'Times New Roman', serif"
    font-weight="700" font-size="210" text-anchor="middle"
    fill="url(#textGrad)" filter="url(#glow)"
    letter-spacing="-8">AF</text>

  <!-- Bottom accent line -->
  <line x1="160" y1="360" x2="352" y2="360" stroke="url(#arcGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>