<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280">
  <defs>
    <radialGradient id="bg" cx="35%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#16043a"/>
      <stop offset="100%" stop-color="#07020f"/>
    </radialGradient>
    <linearGradient id="arcG" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="shG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="textG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(139,92,246,0.35)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="280" rx="24" fill="url(#bg)"/>

  <!-- Subtle background glow -->
  <ellipse cx="140" cy="140" rx="100" ry="100" fill="rgba(139,92,246,0.07)"/>

  <!-- ── Icon mark (left side) ── -->
  <!-- Arc -->
  <path d="M 140 40
    A 100 100 0 1 1 222 222"
    fill="none" stroke="url(#arcG)" stroke-width="14"
    stroke-linecap="round" filter="url(#glow)"/>

  <!-- Shield body -->
  <path d="M 140 72
    L 196 96 L 196 162
    Q 196 210 140 228
    Q 84 210 84 162
    L 84 96 Z"
    fill="url(#shG)" opacity="0.88" filter="url(#shadow)"/>

  <!-- "A" on shield -->
  <path d="M 140 106 L 172 194 L 156 194 L 148 170 L 132 170 L 124 194 L 108 194 Z
           M 140 122 L 151 164 L 129 164 Z"
    fill="white" opacity="0.95"/>

  <!-- ── Wordmark (right side) ── -->
  <!-- ARJUNA -->
  <text x="228" y="130"
    font-family="'Outfit', 'Segoe UI', Arial, sans-serif"
    font-weight="800" font-size="72" letter-spacing="3"
    fill="url(#textG)">ARJUNA</text>

  <!-- FIT -->
  <text x="232" y="198"
    font-family="'Outfit', 'Segoe UI', Arial, sans-serif"
    font-weight="300" font-size="72" letter-spacing="18"
    fill="#a78bfa" opacity="0.9">FIT</text>

  <!-- Tagline -->
  <text x="232" y="236"
    font-family="'Outfit', 'Segoe UI', Arial, sans-serif"
    font-weight="400" font-size="18" letter-spacing="2"
    fill="rgba(167,139,250,0.55)">ENTRENA · COME · AVANZA</text>

  <!-- Accent line between wordmark sections -->
  <line x1="230" y1="148" x2="692" y2="148"
    stroke="rgba(139,92,246,0.18)" stroke-width="1"/>
</svg>