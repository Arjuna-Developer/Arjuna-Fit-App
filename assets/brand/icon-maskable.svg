<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e0b38"/>
      <stop offset="100%" stop-color="#0a0219"/>
    </radialGradient>
    <linearGradient id="arcG" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="shieldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>

  <!-- Outer ring glow -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(168,85,247,0.15)" stroke-width="2"/>

  <!-- Bold arc: 300° arc with gap at bottom-right (like a shield) -->
  <path d="M 256 68
    A 188 188 0 1 1 414 352"
    fill="none" stroke="url(#arcG)" stroke-width="28"
    stroke-linecap="round" filter="url(#glow)"/>

  <!-- Inner shield shape -->
  <path d="M 256 138
    L 352 178 L 352 272
    Q 352 338 256 374
    Q 160 338 160 272
    L 160 178 Z"
    fill="url(#shieldG)" opacity="0.9"/>

  <!-- White "A" lettermark on shield -->
  <path d="M 256 195 L 295 300 L 275 300 L 265 272 L 247 272 L 237 300 L 217 300 Z
           M 256 215 L 268 265 L 244 265 Z"
    fill="white" opacity="0.95"/>

</svg>