<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32-v2.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6D28FF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ArjunaFit">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta charset="UTF-8">
<meta name="af-version" content="mini-beta-day1-war-room-v1">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Demo — ArjunaFit</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#090611;color:#f1f0f4;font-family:'Outfit',sans-serif;
      min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:rgba(18,11,31,.98);border:1px solid rgba(124,58,237,.25);
      border-radius:28px;padding:32px 24px;width:100%;max-width:380px;text-align:center}
    .logo{font-size:40px;margin-bottom:12px}
    h1{font-size:24px;font-weight:800;margin-bottom:6px}
    p{font-size:14px;color:rgba(240,238,248,.55);line-height:1.6;margin-bottom:24px}
    .btn{display:block;width:100%;padding:14px;border-radius:16px;border:none;
      cursor:pointer;font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;
      margin-bottom:10px;transition:opacity .15s}
    .btn-primary{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;
      box-shadow:0 4px 20px rgba(139,92,246,.4)}
    .btn-secondary{background:rgba(255,255,255,.06);color:rgba(240,238,248,.7);
      border:1px solid rgba(255,255,255,.1)}
    .info{font-size:12px;color:rgba(255,255,255,.25);margin-top:16px;line-height:1.6}
    .credentials{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
      border-radius:12px;padding:12px;text-align:left;margin-bottom:20px;font-size:13px}
    .credentials div{color:rgba(240,238,248,.5);margin-bottom:4px}
    .credentials span{color:#c4b5fd;font-weight:600}
  </style>
  <link rel="stylesheet" href="/assets/visual-system.css">
  <script src="/js/core/auth-bootstrap.js"></script>
<script src="/js/core/ops-config.js"></script>
<script src="/js/core/analytics.js"></script>
</head>
<body style="overflow-x:hidden">
<div class="card">
  <div class="logo">🏋️</div>
  <h1>ArjunaFit Demo</h1>
  <p>Explora la app completa con datos de ejemplo. Sin registro necesario.</p>

  <div class="credentials">
    <div>Email: <span>demo@arjunafit.app</span></div>
    <div>Contraseña: <span>ArjunaDemo2026!</span></div>
  </div>

  <button class="btn btn-primary" onclick="loadDemo()">
    🚀 Entrar como demo
  </button>
  <button class="btn btn-secondary" onclick="location.href='/pages/onboarding.html'">
    Crear cuenta real →
  </button>
  <div class="info">
    Los datos demo se guardan localmente.<br>
    No se envía información a ningún servidor.
  </div>
</div>

<script>
function loadDemo() {
  // ── Demo profile ────────────────────────────────
  localStorage.setItem('af-user-name', 'Arjuna');
  localStorage.setItem('af-reto', 'gluteos');
  localStorage.setItem('af-product-tipo', 'reto');
  localStorage.setItem('af-selected-reto', 'gluteos');
  localStorage.setItem('af-week', '1');
  localStorage.setItem('af-day-num', '4');
  localStorage.setItem('af-streak', '4');
  localStorage.setItem('af-trial-start', String(Date.now() - 3 * 24 * 60 * 60 * 1000)); // 3 days ago
  
  // ── Demo goals ──────────────────────────────────
  localStorage.setItem('af-goals', JSON.stringify({
    cal: 2000, prot: 120, carbs: 200, fat: 55
  }));

  // ── Demo food log for today ──────────────────────
  const today = new Date();
  const key = `af-food-${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  localStorage.setItem(key, JSON.stringify([
    { name:'Huevos revueltos + arepa', cal:420, prot:28, carb:35, fat:12, meal:'desayuno', ts: Date.now() - 18000000 },
    { name:'Pechuga con arroz y brócoli', cal:480, prot:45, carb:38, fat:8, meal:'almuerzo', ts: Date.now() - 7200000 },
  ]));

  // ── Demo completed workout ───────────────────────
  // (don't set — let user "complete" it fresh)

  // ── Demo last seen ───────────────────────────────
  localStorage.setItem('af-last-seen', String(Date.now() - 86400000));

  // ── Fake auth session (skip Supabase) ───────────
  // Store a fake session so auth guards pass
  sessionStorage.setItem('af-demo-mode', '1');
  sessionStorage.setItem('af-demo-uid', 'demo-user-001');

  // Redirect to dashboard
  window.location.href = '/pages/dashboard.html';
}
</script>
</body>
</html>
