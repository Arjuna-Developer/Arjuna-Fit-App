<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32-v2.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6D28FF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ArjunaFit">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ArjunaFit · Entrena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0612; --card:#120d1e; --el:#1a1030;
  --glass:rgba(255,255,255,0.04); --gb:rgba(255,255,255,0.07);
  --pri:#7c3aed; --pri2:#9333ea; --pl:#c4b5fd;
  --acc:#ec4899; --al:#f9a8d4;
  --ok:#10b981; --warn:#f59e0b; --inf:#3b82f6;
  --t:#f1f0f4; --t2:#c4b5fd; --t3:#7c6fa0; --tm:#2d2250;
  --bd:rgba(124,58,237,.25);
  --f:'Outfit',sans-serif; --mx:430px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t);
  font-family:var(--f);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 20% 10%,rgba(124,58,237,.18),transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 80%,rgba(236,72,153,.12),transparent 60%);}
.hdr-l{display:flex;align-items:center;gap:12px}
.back{width:38px;height:38px;border-radius:13px;background:var(--glass);
  border:1px solid var(--gb);backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;text-decoration:none;cursor:pointer;transition:transform .15s}
.back:active{transform:scale(.9)}
.hdr-title{font-size:15px;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.hdr-sub{font-size:11px;color:var(--t3);margin-top:2px}
.timer-pill{background:var(--glass);border:1px solid var(--gb);
  backdrop-filter:blur(12px);padding:5px 12px;border-radius:11px;
  font-size:19px;font-weight:700;letter-spacing:-.03em;color:var(--pl);
  font-variant-numeric:tabular-nums}
.ps{height:4px;flex:1;border-radius:2px;background:var(--tm);
  transition:background .4s,transform .15s;
  cursor:pointer;-webkit-tap-highlight-color:transparent;}
.ps:active{transform:scaleY(2.5);}
.ps.done{background:var(--ok)}
.ps.active{background:linear-gradient(90deg,var(--pri),var(--acc));
  box-shadow:0 0 6px rgba(124,58,237,.5)}
.page{
  position:relative;z-index:1;
  max-width:var(--mx);margin:0 auto;
  height:100dvh;            /* exact viewport height */
  display:flex;flex-direction:column;
  overflow:hidden;          /* prevent body scroll */
}

/* ── Header — fixed height ── */
.hdr{
  flex-shrink:0;
  padding:calc(env(safe-area-inset-top)+14px) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
}

/* ── Phase strip — fixed height ── */
.phase-strip{
  flex-shrink:0;
  display:flex;gap:4px;padding:10px 16px 0;
}

/* ── Scroll area — fills all remaining space ── */
.scroll{
  flex:1;                   /* takes all remaining height */
  overflow-y:auto;
  overflow-x:hidden;
  padding:12px 16px 16px;  /* NO huge padding-bottom needed */
  -webkit-overflow-scrolling:touch;
}


/* ── Bottom CTA footer — flex child, NOT fixed ── */
.bottom-bar{
  flex-shrink:0;            /* stays at bottom, never overlaps scroll */
  padding:8px 16px calc(8px + env(safe-area-inset-bottom));
  background:rgba(10,5,22,.97);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.06);
}

/* ── Section title ── */
.sec-title{font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--t3);margin-bottom:12px}

/* ── Session intro card ── */
.sess-intro{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#1c0a38,#0f0620);
  border:1px solid var(--bd);border-radius:24px;padding:22px;margin-bottom:20px;
  box-shadow:0 0 0 1px rgba(255,255,255,.03),0 20px 60px rgba(0,0,0,.4);
}
.sess-intro::before{content:'';position:absolute;top:-40px;right:-40px;
  width:160px;height:160px;border-radius:50%;
  background:rgba(124,58,237,.25);filter:blur(50px);pointer-events:none}
.si-z{position:relative;z-index:1}
.si-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--pl);
  background:rgba(124,58,237,.15);border:1px solid rgba(196,181,253,.2);
  padding:3px 11px;border-radius:20px;margin-bottom:12px}
.si-emoji{font-size:42px;display:block;margin-bottom:8px;
  filter:drop-shadow(0 0 16px rgba(124,58,237,.6));
  animation:em-float 3s ease-in-out infinite}
@keyframes em-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.si-name{font-size:24px;font-weight:900;letter-spacing:-.04em;margin-bottom:4px}
.si-focus{font-size:13px;color:var(--t3);margin-bottom:14px}
.si-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.si-chip{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--t3);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);
  border-radius:8px;padding:5px 10px}
.btn-start-main{
  width:100%;padding:15px;border-radius:17px;border:none;
  background:linear-gradient(135deg,var(--pri),var(--pri2),#a855f7);
  color:#fff;font-family:var(--f);font-size:16px;font-weight:800;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 6px 28px rgba(124,58,237,.5),0 0 0 1px rgba(255,255,255,.1) inset;
  position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.btn-start-main::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.15),transparent 60%)}
.btn-start-main:active{transform:scale(.97)}

/* ── Phase section header ── */
.phase-section{
  border-radius:20px;margin-bottom:16px;overflow:hidden;
}
.phase-hdr{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  background:var(--card);border:1px solid rgba(255,255,255,.06);
  cursor:pointer;user-select:none;border-radius:20px;
  transition:background .15s;
  -webkit-tap-highlight-color:transparent;
}
.phase-hdr:active{background:rgba(255,255,255,.03)}
.phase-hdr.open{border-radius:20px 20px 0 0}
.ph-icon{font-size:24px;flex-shrink:0}
.ph-info{flex:1}
.ph-name{font-size:15px;font-weight:700;letter-spacing:-.01em}
.ph-detail{font-size:12px;color:var(--t3);margin-top:2px}
.ph-status{font-size:12px;font-weight:700;padding:3px 10px;
  border-radius:20px;flex-shrink:0}
.status-pending{color:var(--t3);background:rgba(255,255,255,.05)}
.status-active{color:var(--warn);background:rgba(245,158,11,.1);
  border:1px solid rgba(245,158,11,.2)}
.status-done{color:var(--ok);background:rgba(16,185,129,.1);
  border:1px solid rgba(16,185,129,.2)}
.ph-chevron{font-size:14px;color:var(--tm);transition:transform .25s;flex-shrink:0}
.phase-hdr.open .ph-chevron{transform:rotate(180deg)}

/* ── Phase body ── */
.phase-body{
  display:none;background:var(--card);
  border:1px solid rgba(255,255,255,.06);border-top:none;
  border-radius:0 0 20px 20px;padding:14px 16px 16px;
}
.phase-section.open .phase-hdr{border-radius:20px 20px 0 0}
.phase-section.open .phase-body{display:block}

/* ── Video placeholder — premium ── */
.video-slot{
  position:relative;width:100%;aspect-ratio:16/9;
  border-radius:18px;overflow:hidden;margin-bottom:14px;cursor:pointer;
  background:linear-gradient(145deg,#1c0935 0%,#0d0620 60%,#150828 100%);
  border:1px solid rgba(124,58,237,.18);
  display:flex;align-items:flex-end;
  transition:border-color .2s,transform .15s;
  box-shadow:0 4px 24px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.02);
}
.video-slot:active{transform:scale(.98);border-color:rgba(124,58,237,.4)}

/* Ambient glow top-right */
.video-slot::before{
  content:'';position:absolute;top:-20px;right:-20px;
  width:120px;height:120px;border-radius:50%;
  background:rgba(124,58,237,.2);filter:blur(40px);
  pointer-events:none;
}
/* Bottom gradient overlay */
.video-slot::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,
    transparent 25%,
    rgba(10,5,20,.5) 60%,
    rgba(10,5,20,.85) 100%);
  pointer-events:none;
}
/* Play button — centered */
.video-play{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-55%);
  width:52px;height:52px;border-radius:50%;
  background:rgba(124,58,237,.25);
  backdrop-filter:blur(8px);
  border:1.5px solid rgba(196,181,253,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;z-index:2;
  transition:background .2s,transform .2s;
}
.video-slot:active .video-play{
  background:rgba(124,58,237,.45);
  transform:translate(-50%,-55%) scale(1.08);
}
/* Title + badge — bottom */
.video-info{
  position:relative;z-index:2;
  padding:12px 14px;width:100%;
}
.video-title{
  font-size:13px;font-weight:600;color:rgba(255,255,255,.9);
  margin-bottom:5px;letter-spacing:-.01em;
}
.video-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:600;letter-spacing:.05em;
  color:rgba(255,255,255,.45);
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);
  padding:3px 9px;border-radius:20px;
}

/* ── Warmup/mobility exercise items ── */
.simple-ex{
  display:flex;align-items:center;gap:12px;padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.simple-ex:last-of-type{border-bottom:none}
.se-icon{
  width:38px;height:38px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.se-info{flex:1;min-width:0}
.se-name{font-size:14px;font-weight:700;letter-spacing:-.01em}
.se-spec{font-size:12px;color:var(--t3);margin-top:2px}
.se-done{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  border:1.5px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;
  transition:all .15s;-webkit-tap-highlight-color:transparent}
.se-done:active{transform:scale(.9)}
.se-done.on{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.4);color:var(--ok)}

/* ── Main exercise cards ── */
.ex-list{display:flex;flex-direction:column;gap:6px}
.ex-card{
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
  border-radius:16px;overflow:hidden;
  transition:border-color .25s,box-shadow .25s,opacity .2s,background .25s;
}
/* Accordion: dim non-active cards */
.ex-list:has(.ex-card.open) .ex-card:not(.open):not(.completed){
  opacity:.55;
}
.ex-card.open.current{
  border-color:rgba(124,58,237,.4);
  background:rgba(124,58,237,.04);
  box-shadow:0 0 0 1px rgba(124,58,237,.08),0 4px 20px rgba(0,0,0,.3);
}
.ex-card.completed{
  opacity:.4;
  border-color:rgba(16,185,129,.12);
}
.ex-hdr{
  display:flex;align-items:center;gap:11px;padding:12px 14px;
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
  transition:background .15s;
}
.ex-hdr:active{background:rgba(255,255,255,.03)}
.ex-idx{
  width:28px;height:28px;border-radius:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;
  background:rgba(255,255,255,.06);color:var(--t3);
  transition:all .25s;
}
.ex-card.current .ex-idx{background:var(--pri);color:#fff;box-shadow:0 0 10px rgba(124,58,237,.45);}
.ex-card.completed .ex-idx{background:var(--ok);color:#fff}
.ex-meta{flex:1;min-width:0}
.ex-name{font-size:14px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.ex-card.current .ex-name{color:#fff}
.ex-spec{font-size:11px;color:var(--t3);margin-top:1px;font-weight:400}
.ex-tog{
  width:24px;height:24px;border-radius:7px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.04);font-size:11px;color:var(--tm);
  transition:transform .25s,background .2s;
}
.ex-card.open .ex-tog{transform:rotate(180deg);background:rgba(124,58,237,.15);color:var(--pl)}
.ex-body{
  display:none;  /* MUST be hidden by default */
  border-top:1px solid rgba(255,255,255,.05);
  padding:11px 14px 13px;
}
.ex-card.open .ex-body{
  display:block;
  animation:slide-up .2s ease both;
}
.sets-head{display:grid;grid-template-columns:22px 1fr 1fr 40px;gap:6px;
  margin-bottom:6px;font-size:9px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--tm);text-align:center}
.set-row{display:grid;grid-template-columns:22px 1fr 1fr 40px;gap:6px;
  align-items:center;margin-bottom:6px}
.set-n{font-size:11px;font-weight:600;color:var(--t3);text-align:center}
.set-inp{height:40px;background:rgba(255,255,255,.04);
  border:1.5px solid rgba(255,255,255,.07);border-radius:10px;
  text-align:center;font-family:var(--f);font-size:16px;font-weight:600;
  color:var(--t);outline:none;width:100%;
  transition:border-color .2s,background .2s;-webkit-appearance:none;appearance:none}
.set-inp:focus{border-color:rgba(124,58,237,.5);background:rgba(124,58,237,.06)}
.set-inp.v{border-color:rgba(124,58,237,.2)}
.set-done{width:40px;height:40px;border-radius:10px;
  border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;transition:all .18s;
  -webkit-tap-highlight-color:transparent}
.set-done:active{transform:scale(.88)}
.set-done.on{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.4);color:var(--ok)}
/* Completed row dim */
.set-row:has(.set-done.on) .set-inp{opacity:.45}
.set-row:has(.set-done.on) .set-n{opacity:.45}
.ex-cue{margin-top:9px;padding:9px 11px;
  background:rgba(124,58,237,.06);border:1px solid rgba(196,181,253,.1);
  border-radius:10px;font-size:12px;color:var(--t2);line-height:1.6;font-weight:400}
.ex-cue b{color:var(--pl);font-weight:600}

/* ── CTA button ── */
.btn-next-phase{
  width:100%;padding:13px 16px;border-radius:14px;border:none;
  color:#fff;font-family:var(--f);font-size:14px;font-weight:600;
  letter-spacing:-.01em;white-space:nowrap;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  position:relative;overflow:hidden;
  transition:transform .15s cubic-bezier(.4,0,.2,1);
}
.btn-next-phase::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 55%);
  pointer-events:none;
}
.btn-next-phase:active{transform:scale(.97);}
.btn-next-phase:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.bnsub{
  text-align:center;font-size:11px;color:var(--t3);
  margin-top:5px;font-weight:400;
}
.bspn{
  width:15px;height:15px;border-radius:50%;flex-shrink:0;
  border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  display:none;animation:spin .6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── State ── */
.state{flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:40px 24px;text-align:center;gap:12px}
.state-icon{font-size:52px;filter:drop-shadow(0 0 20px rgba(124,58,237,.4))}
.state-title{font-size:22px;font-weight:800;letter-spacing:-.03em}
.state-sub{font-size:14px;color:var(--t3);line-height:1.6;max-width:280px}
.state-btn{padding:14px 28px;border-radius:16px;border:none;
  background:linear-gradient(135deg,var(--pri),var(--pri2));
  color:#fff;font-family:var(--f);font-size:15px;font-weight:700;
  cursor:pointer;text-decoration:none;
  box-shadow:0 4px 20px rgba(124,58,237,.4);transition:transform .15s}
.state-btn:active{transform:scale(.97)}

/* ── Loader ── */
.ldr{position:fixed;inset:0;background:var(--bg);z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .35s,visibility .35s}
.ldr.off{opacity:0;visibility:hidden;pointer-events:none}
.ldr-icon{font-size:48px;animation:lf 2s ease-in-out infinite;
  filter:drop-shadow(0 0 24px rgba(124,58,237,.65))}
@keyframes lf{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ldr-dots{display:flex;gap:6px}
.ldr-dot{width:7px;height:7px;border-radius:50%;background:var(--pri);
  animation:ld 1.4s ease infinite}
.ldr-dot:nth-child(2){animation-delay:.2s}
.ldr-dot:nth-child(3){animation-delay:.4s}
@keyframes ld{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
@keyframes slide-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(16px) scale(.95)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes flash-in{from{opacity:0}to{opacity:1}}
@keyframes flash-out{to{opacity:0}}
@keyframes flash-icon{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
/* Set completion animation */
@keyframes set-check {
  0%   { transform:scale(1); }
  35%  { transform:scale(1.4); background:rgba(16,185,129,.5); border-color:var(--ok); }
  70%  { transform:scale(.9); }
  100% { transform:scale(1); }
}
/* Input active row highlight */
.set-row:has(.set-inp:focus) { background:rgba(124,58,237,.04); border-radius:10px; }
/* Set done animation class */
.set-done.just-done { animation: set-check .35s cubic-bezier(.34,1.2,.64,1) both; }
@keyframes cam-breathe{
  0%,100%{box-shadow:0 0 20px rgba(139,92,246,.5),0 0 40px rgba(236,72,153,.2),0 0 0 8px rgba(139,92,246,.08);}
  50%{box-shadow:0 0 32px rgba(139,92,246,.7),0 0 60px rgba(236,72,153,.35),0 0 0 12px rgba(139,92,246,.12);}
}
.scroll{scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
</style>

  <style>
  .nav-ambient{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,430px);height:140px;background:radial-gradient(ellipse at 50% 100%,rgba(124,58,237,.18) 0%,rgba(168,85,247,.1) 30%,transparent 70%);filter:blur(20px);z-index:99;pointer-events:none}
  nav[style*="position:fixed"]{background:rgba(12,7,22,.88)!important;backdrop-filter:blur(40px) saturate(1.8)!important;-webkit-backdrop-filter:blur(40px) saturate(1.8)!important;border-radius:26px!important;border-color:rgba(196,181,253,.08)!important;box-shadow:0 -1px 0 rgba(255,255,255,.04) inset,0 12px 40px rgba(0,0,0,.55),0 0 60px rgba(124,58,237,.06)!important}
  </style>

<body>

function saveProgressionChoice(weight, choice) {
  // choice: 'increase' | 'repeat' | 'easy_day'
  const entry = {
    exercise: S.session?.exercises?.[0]?.name || 'unknown',
    weight: parseFloat(weight) || 0,
    choice,
    ts: Date.now()
  };
  _progressionLog.push(entry);

    increase: 'Intentarlo también cuenta.',
    repeat:   'Repetir con control también es progreso.',
    easy_day: 'Escuchar el cuerpo también hace parte del proceso.'

// ── Progresión sin miedo ─────────────────────────────
function checkProgressionSuggestion(exerciseName, lastWeight) {
  if (!lastWeight || lastWeight <= 0) return null;
  const suggested = Math.round((lastWeight + 2.5) * 4) / 4;
  return {
    last: lastWeight,
    suggested,
    msg: `La semana pasada hiciste ${lastWeight}kg. ¿Probamos ${suggested}kg?`
  };
}

function showProgressionPrompt(exerciseName, lastWeight) {
  const suggestion = checkProgressionSuggestion(exerciseName, lastWeight);
  if (!suggestion) return;
  
  const existing = document.getElementById('prog-prompt');
  if (existing) existing.remove();
  
  const el = document.createElement('div');
  el.id = 'prog-prompt';
  el.style.cssText = 'position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:398px;z-index:300;background:rgba(14,8,28,.98);border:1px solid rgba(250,204,21,.3);border-radius:20px;padding:16px 18px;font-family:\'Outfit\',sans-serif;box-shadow:0 8px 32px rgba(0,0,0,.5),0 0 20px rgba(250,204,21,.08);animation:prog-in .4s cubic-bezier(.34,1.1,.64,1) both';

  if (!document.getElementById('prog-css')) {
    const s = document.createElement('style');
    s.id = 'prog-css';
    if (s) s.textContent = '@keyframes prog-in{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}';
    document.head.appendChild(s);
  }
  
  var pp = document.createElement('div');
  pp.style.cssText = 'display:flex;align-items:flex-start;gap:12px';
  pp.innerHTML = '<div style="font-size:22px;flex-shrink:0">💡</div><div style="flex:1"><div style="font-size:13px;color:rgba(240,238,248,.8);line-height:1.6;margin-bottom:12px">' + suggestion.msg + '</div><div style="display:flex;gap:8px"><button id="pp-inc" style="flex:1;padding:9px;border-radius:11px;border:none;cursor:pointer;background:rgba(250,204,21,.15);color:#fcd34d;font-family:Outfit,sans-serif;font-size:12px;font-weight:700">Sí, probar ' + suggestion.suggested + 'kg</button><button id="pp-rep" style="flex:1;padding:9px;border-radius:11px;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(240,238,248,.5);font-family:Outfit,sans-serif;font-size:12px">Hoy voy suave</button></div></div><button id="pp-cls" style="padding:4px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(255,255,255,.3);font-family:Outfit,sans-serif;font-size:11px;cursor:pointer">✕</button>';
  el.appendChild(pp);
  var sug = suggestion.suggested; var last = suggestion.last;
  el.querySelector('#pp-inc').addEventListener('click', function() { saveProgressionChoice(sug,'increase'); document.getElementById('prog-prompt').remove(); });
  el.querySelector('#pp-rep').addEventListener('click', function() { saveProgressionChoice(last,'repeat'); document.getElementById('prog-prompt').remove(); });
  el.querySelector('#pp-cls').addEventListener('click', function() { document.getElementById('prog-prompt').remove(); });

  document.body.appendChild(el);
  setTimeout(function() { var e = document.getElementById('prog-prompt'); if(e) e.remove(); }, 15000);
}
    function toggleWorkoutVoice() {
      if (!window.AF?.voice) return;

        btn.textContent = muted ? '🔇' : '🔊';
        btn.style.transform = 'scale(0.85)';
        setTimeout(() => btn.style.transform = '', 150);

      const btn = document.getElementById('voiceToggleBtn');
      if (btn && window.AF?.voice?.isMuted()) btn.textContent = '🔇';
    });

// Shared SVG gradient (injected once)
function ensureTimerGradient() {
  if (document.getElementById('timerGradDefs')) return;
  const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.id = 'timerGradDefs'; s.style.cssText = 'position:absolute;width:0;height:0';
  s.innerHTML = `<defs><linearGradient id="timerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#ec4899"/>
  </linearGradient></defs>`;
  document.body.appendChild(s);
}

function startIsoTimer(id, seconds, key, idx) {
  ensureTimerGradient();
  if (_isoTimer) clearInterval(_isoTimer);

  document.getElementById(`${id}_btn`).style.display = 'none';
  document.getElementById(`${id}_timer`).style.display = 'block';

  const circumference = 213.6;
  let remaining = seconds;
  let paused = false;
  window[`_isoPaused_${id}`] = false;

  const ring  = document.getElementById(`${id}_ring`);
  const count = document.getElementById(`${id}_count`);
  const label = document.getElementById(`${id}_label`);

  const update = () => {
    if (ring) ring.style.strokeDashoffset =
      circumference * (1 - remaining / seconds);
    if (count) count.textContent = remaining > 0 ? `${remaining}s` : '¡Listo!';
    if (label) {
      if (remaining > seconds * 0.6) label.textContent = 'AGUANTA';
      else if (remaining > seconds * 0.3) label.textContent = 'CASI';
      else if (remaining > 0) label.textContent = 'ÚLTIMO TRAMO';
      else label.textContent = '✓ COMPLETADO';
    }
  };
  update();

  _isoTimer = setInterval(() => {
    if (window[`_isoPaused_${id}`]) return;
    remaining--;
    update();
    // 🗣️ Voice countdown last 10 seconds
    if (remaining <= 10 && remaining > 0 && remaining % 5 === 0) {
      window.AF?.voice?.speak(String(remaining));
    }
    if (remaining <= 0) {
      clearInterval(_isoTimer);
      window.AF?.voice?.speak('Muy bien.');
      try { navigator.vibrate?.([200, 100, 200]); } catch(e) {}
      setTimeout(() => doneIsoTimer(id, key, idx), 800);
    }
  }, 1000);

  window[`_isoRemaining_${id}`] = () => remaining;
}

function pauseIsoTimer(id) {
  const paused = !window[`_isoPaused_${id}`];
  window[`_isoPaused_${id}`] = paused;
  const btn = document.getElementById(`${id}_pause`);
  if (btn) btn.textContent = paused ? '▶ Reanudar' : '⏸ Pausar';
}

function doneIsoTimer(id, key, idx) {
  clearInterval(_isoTimer);
  const wrap = document.getElementById(`${id}_wrap`);
  const timer = document.getElementById(`${id}_timer`);
  if (timer) timer.style.display = 'none';
  if (wrap) {
    wrap.style.opacity = '0.5';
    const btn = document.getElementById(`${id}_btn`);
    if (btn) { btn.style.display = 'block'; btn.textContent = '✓ Hecho'; btn.style.opacity = '0.4'; }
  }
  if (!S.simpleChecks[key]) S.simpleChecks[key] = {};
  S.simpleChecks[key][idx] = true;
}

function navigateToPhase(targetPhase) {
  if (targetPhase === S.phase) return;
  if (targetPhase > S.phase) {
    // Can only skip forward if current phase allows
    if (targetPhase - S.phase > 1) {
      return; // Don't allow skipping multiple phases forward
    }
  }
  console.log(`[Workout] Navigate: phase ${S.phase} → ${targetPhase}`);
  if (targetPhase > S.phase) {
    // Going forward — use normal nextPhase-like flow
    S.phase = targetPhase;
  } else {
    // Going back — always allowed
    S.phase = targetPhase;
  }
  saveWorkoutState();
  showPhaseFlash(S.phase);
}

function toggleEx(i) {
  const card = document.getElementById(`ec_${i}`);
  if (!card) return;
  const isOpen = card.classList.contains('open');

  // Accordion: close all others
  document.querySelectorAll('.ex-card.open').forEach(c => {
    c.classList.remove('open', 'current');
  });

  if (!isOpen) {
    card.classList.add('open', 'current');
    setTimeout(() => card.scrollIntoView({ behavior:'smooth', block:'nearest' }), 180);
  }
}

  if(el.value) el.classList.add('v');

function toggleSet(i,s){
  S.sets[i]=S.sets[i]||[];
  S.sets[i][s]=S.sets[i][s]||{};
  S.sets[i][s].done=!S.sets[i][s].done;
  const btn=document.getElementById(`sd_${i}_${s}`);
  btn.classList.toggle('on',S.sets[i][s].done);

  if(S.sets[i][s].done){
    // Set completion animation
    btn.classList.add('just-done');
    setTimeout(() => btn.classList.remove('just-done'), 400);
    const rest=S.session.exercises[i]?.rest||60;
    showRestToast(rest);
    saveSet(i, s, S.sets[i][s]);
  }

  const card=document.getElementById(`ec_${i}`);
  const idx=document.getElementById(`ei_${i}`);
  const allDone=(S.sets[i]||[]).length>=S.session.exercises[i].sets &&
    (S.sets[i]||[]).every(x=>x.done);
  card.classList.toggle('completed',allDone);
  if(allDone){idx.textContent='✓';card.classList.remove('current');}
  checkMainDone();
  saveWorkoutState();
}

// ── Session state persistence ─────────────────
function saveWorkoutState() {
  try {
    sessionStorage.setItem('af-workout-live', JSON.stringify({
      phase: S.phase, dayNum: S.dayNum, weekNum: S.weekNum,
      simpleChecks: S.simpleChecks, sets: S.sets, startMs: S.startMs,
      sessionKey: getType(S.dayNum),
      savedAt: Date.now(),
    }));
  } catch(e) {}
}

function restoreWorkoutState() {
  try {
    const raw = sessionStorage.getItem('af-workout-live');
    if (!raw) return false;
    const st = JSON.parse(raw);
    // Only restore if within 3 hours and same session
    if (Date.now() - st.savedAt > 3 * 60 * 60 * 1000) return false;
    if (st.dayNum !== S.dayNum) return false;
    S.phase = Math.max(-1, st.phase);
    S.simpleChecks = st.simpleChecks || {};
    S.sets = st.sets || {};
    S.startMs = st.startMs;
    console.log('[AF] Estado de sesión restaurado — fase', S.phase);
    return true;
  } catch(e) { return false; }
}

// ── Guardar set to Supabase (silent fail) ───────
async function saveSet(exIdx, setIdx, setData) {
  if(window.AF) AF.track('set_logged', {ex: exIdx, set: setIdx});
  if (!_sb || !S.uid || !setData.done) return;
  const ex = S.session.exercises[exIdx];
  const kg = parseFloat(setData.kg) || 0;
  const reps = parseInt(setData.reps) || 0;
  if (!kg && !reps) return;

  try {
    await _sb.from('workout_sets').insert({
      user_id: S.uid, day_num: S.dayNum,
      exercise_name: ex.name, set_num: setIdx + 1,
      weight_kg: kg || null, reps: reps || null,
      created_at: new Date().toISOString(),
    });
    if (kg > 0) checkPR(ex.name, kg, reps);
  } catch(e) {
    console.warn('[AF] workout_sets save failed — usando local fallback');
    // Store locally for later sync
    const key = `af-sets-${S.dayNum}`;
    const local = JSON.parse(localStorage.getItem(key) || '[]');
    local.push({ exercise: ex.name, set: setIdx+1, kg, reps, ts: Date.now() });
    localStorage.setItem(key, JSON.stringify(local.slice(-50)));
  }
}

// ── PR Detection ──────────────────────────────
const _localMaxes = {};

async function checkPR(exName, kg, reps) {
  // Check local cache first (instant)
  const localMax = _localMaxes[exName] || 0;
  if (kg > localMax) {
    _localMaxes[exName] = kg;
    const diff = localMax > 0 ? `+${(kg - localMax).toFixed(1)}kg` : 'Primer registro';
    showPRToast(exName, kg, diff);
    window.AF?.voice?.speak('Nuevo récord personal.');
    // Guardar to Supabase
    if (_sb && S.uid) {
      _sb.from('personal_records').upsert({
        user_id: S.uid, exercise_name: exName,
        record_type: 'max_kg', value: kg,
        achieved_at: new Date().toISOString(),
      }, { onConflict: 'user_id,exercise_name,record_type' }).catch(() => {});
    }
  }
}

async function loadPRs() {
  if (!_sb || !S.uid) return;
  try {
    const { data } = await _sb.from('personal_records')
      .select('exercise_name,value')
      .eq('user_id', S.uid).eq('record_type', 'max_kg');
    (data || []).forEach(r => { _localMaxes[r.exercise_name] = r.value; });
    console.log('[AF] PRs cargados:', Object.keys(_localMaxes).length);
  } catch(e) {}
}

function checkMainDone(){
  const total=S.session.exercises.length;
  const done=Object.keys(S.sets).filter(k=>{
    const ex=S.session.exercises[k];
    return (S.sets[k]||[]).length>=ex.sets&&(S.sets[k]||[]).every(x=>x.done);
  }).length;
  document.getElementById('nextBtn').disabled=done<total;
  document.getElementById('nextSub').textContent=done<total?
    `${total-done} ejercicio${total-done!==1?'s':''} restante${total-done!==1?'s':''}`:
    '✓ Todo completado — toca para el enfriamiento';
}

    }
    return;
  }
  S.phase--;

  showPhaseFlash(S.phase);
}

      // Toast
      var t=document.createElement('div');
      t.style.cssText='position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:400;background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.35);border-radius:13px;padding:10px 20px;font-family:Outfit,sans-serif;font-size:13px;font-weight:700;color:#fcd34d;white-space:nowrap;';
      t.textContent='Completa todos los ejercicios primero ✓';
      document.body.appendChild(t);
      setTimeout(function(){ t.remove(); }, 2000);
      return;
    }
  }
  S.phase++;
  saveWorkoutState();
  if(S.phase>4){finishWorkout();return;}
  showPhaseFlash(S.phase);
}

  const PM=[
    {icon:'🔥',name:'Calentamiento',color:'rgba(245,158,11,.15)'},

    {icon:'🧘',name:'Enfriamiento',color:'rgba(99,102,241,.15)'},

  const p=PM[phase]||PM[0];

      animation:flash-icon .3s ease both">${p.icon}</div>

  try{

async function loadRealData() {
  if (!_sb) { console.warn('[AF] Supabase no disponible'); return; }
  try {
    console.log('[AF] Obteniendo sesión...');
    const { data: { session } } = await Promise.race([
      _sb.auth.getSession(),
      new Promise((_, r) => setTimeout(() => r(new Error('auth timeout')), 4000))
    ]);

    if (!session?.user) {
      console.log('[AF] Sin sesión → login');
      window.location.replace('/');
      return;
    }
    S.uid = session.user.id;
    console.log('[AF] Sesión OK, uid:', S.uid.slice(0, 8));

    const { data: p } = await Promise.race([
      _sb.from('profiles').select('*').eq('id', S.uid).maybeSingle(),
      new Promise((_, r) => setTimeout(() => r(new Error('profile timeout')), 4000))
    ]).catch(e => { console.warn('[AF] Profile error:', e.message); return { data: null }; });

    if (!p) { console.warn('[AF] Sin perfil — usando Sem1'); return; }
    if (!p.onboarding_completed) {
      window.location.replace('/pages/onboarding.html'); return;
    }

    const completed = p.workout_day_num || 0;
    if (completed >= 37) {
      showState('🎉', '¡Reto completado!', '¡37 días! Eres increíble.',
        [{ label: 'Ver progreso →', href: '/pages/progress.html' }]);
      return;
    }

    // Check if already trained today
    const todayStr = new Date().toISOString().split('T')[0];
    let alreadyTrained = false;
    try {
      const { data: tp } = await Promise.race([
        _sb.from('progress').select('id').eq('user_id', S.uid)
           .gte('created_at', todayStr).limit(1),
        new Promise((_, r) => setTimeout(() => r(new Error('prog timeout')), 3000))
      ]);
      if (tp?.length) alreadyTrained = true;
    } catch(e) { console.warn('[AF] Progress check failed:', e.message); }

    if (alreadyTrained) {
      showState('🏆', '¡Ya entrenaste hoy!', 'Descansa y vuelve mañana.',
        [{ label: 'Volver al inicio', href: '/pages/dashboard.html' }]);
      return;
    }

    S.profile = p;
    console.log(`[AF] Perfil OK — día ${completed + 1}`);
    // ✅ Actualizar con datos reales
    showWorkoutNow(completed + 1, p.nombre || '');

  } catch(e) {
    console.error('[AF] loadRealData error:', e.message);
    // Workout ya está mostrando Sem1 — no hacer nada
  }
}

// ── buildPhaseBody: generates accordion content per phase ─────────────────
</script>

<script src="/js/core/transitions.js">
// ── buildPhaseBody: content for each accordion phase ─────────────────────
function buildPhaseBody(phaseIndex, sess) {
  var idx = phaseIndex;
  var rows = [];
  if (idx === 0) {
    var steps = (sess && sess.warmup && sess.warmup.steps) ? sess.warmup.steps : [
      {name:'Círculos de cadera', detail:'10 por lado — suave'},
      {name:'Sentadilla suave', detail:'10 reps — sin peso'},
      {name:'Puente de glúteo', detail:'15 reps — aprieta arriba'},
      {name:'Abducciones con banda', detail:'20 reps'},
    ];
    rows = steps.map(function(s,i){ 
    var typeClass = s.type ? ' type-'+s.type : '';
    return '<div class="pbe-row'+typeClass+'">'+
      '<div class="pbe-row-num">'+(i+1)+'</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div class="pbe-name">'+s.name+'</div>'+
        '<div class="pbe-detail">'+(s.detail||'')+'</div>'+
      '</div></div>';
  });
  } else if (idx === 1) {
    rows = [{name:'Flexión cadera 90/90',d:'8 por lado'},{name:'Estiramiento piriforme',d:'30 seg c/lado'},{name:'Hip flexor stretch',d:'30 seg c/lado'},{name:'Rotaciones de columna',d:'8 por lado'}]
      .map(function(e,i){ return '<div class="pbe-row type-movilidad"><div class="pbe-row-num">'+(i+1)+'</div><div style="flex:1"><div class="pbe-name">'+e.name+'</div><div class="pbe-detail">'+e.d+'</div></div></div>'; });
  } else if (idx === 2) {
    rows = [{name:'Clamshell con banda',d:'15 reps c/lado'},{name:'Extensión cadera en 4 puntos',d:'12 reps c/lado'},{name:'Sentadilla goblet liviana',d:'10 reps'},{name:'Hip thrust sin peso',d:'15 reps'}]
      .map(function(e,i){ return '<div class="pbe-row type-movilidad"><div class="pbe-row-num">'+(i+1)+'</div><div style="flex:1"><div class="pbe-name">'+e.name+'</div><div class="pbe-detail">'+e.d+'</div></div></div>'; });
  } else if (idx === 3) {
    var exs = (sess && sess.exercises) ? sess.exercises : [];
    rows = exs.map(function(e,_i3){ return '<div class="pbe-row pbe-main" style="border:1px solid rgba(124,58,237,.2);border-left:2px solid rgba(124,58,237,.65);background:rgba(124,58,237,.06)"><div class="pbe-row-num" style="background:rgba(124,58,237,.25);border-color:rgba(124,58,237,.4)">'+((_i3||0)+1)+'</div><div style="flex:1"><div class="pbe-name">'+e.name+'</div><div class="pbe-detail">'+e.sets+' series × '+e.reps+' · '+e.rest+'s descanso</div><div class="pbe-tip">'+(e.tip||'')+'</div></div>'; });
    if (!rows.length) rows = ['<div class="pbe-row"><div class="pbe-name">Hip Thrust con Barra</div><div class="pbe-detail">4 series × 10-12 reps · 90s</div></div>','<div class="pbe-row"><div class="pbe-name">Sentadilla Búlgara</div><div class="pbe-detail">3 series × 10 c/lado · 75s</div></div>','<div class="pbe-row"><div class="pbe-name">Peso Muerto Rumano</div><div class="pbe-detail">3 series × 12 reps · 75s</div></div>','<div class="pbe-row"><div class="pbe-name">Abducción Cadera Cable</div><div class="pbe-detail">3 series × 15 c/lado · 60s</div></div>'];
  } else if (idx === 4) {
    rows = [{name:'Estiramiento piriforme',d:'45 seg c/lado'},{name:'Figura 4 en el suelo',d:'45 seg c/lado'},{name:'Cat-cow',d:'10 respiraciones'},{name:"Child's pose",d:'60 seg'}]
      .map(function(e,i){ return '<div class="pbe-row type-movilidad"><div class="pbe-row-num">'+(i+1)+'</div><div style="flex:1"><div class="pbe-name">'+e.name+'</div><div class="pbe-detail">'+e.d+'</div></div></div>'; });
  }
  return rows.length ? '<div class="pbe-list">'+rows.join('')+'</div>' : '<div class="pbe-empty">Ver ejercicios al empezar la sesión.</div>';
}

</script>
