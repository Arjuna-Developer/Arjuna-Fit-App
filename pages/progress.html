// localDateKey — fecha local Colombia (no UTC)
function localDateKey() {
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

<style>
:root{
  --bg:#0c0714;--card:#130d22;--el:#1a1030;
  --pri:#7c3aed;--pl:#c4b5fd;--acc:#ec4899;
  --ok:#10b981;--warn:#f59e0b;
  --t:#f1f0f4;--t2:#c4b5fd;--t3:#7c6fa0;--tm:#3d3258;
  --bd:rgba(124,58,237,.2);--su:rgba(255,255,255,.06);
  --f:'Outfit',sans-serif;--mx:430px;--nav:64px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:var(--f);
  -webkit-font-smoothing:antialiased;min-height:100dvh}
.page{max-width:var(--mx);margin:0 auto;min-height:100dvh;
  padding-bottom:calc(90px + env(safe-area-inset-bottom));
  position:sticky;top:0;z-index:10;
  background:linear-gradient(to bottom,var(--bg) 60%,transparent);
  padding-bottom:12px}
.hdr-title{font-size:22px;font-weight:800;letter-spacing:-.03em}
.hdr-sub{font-size:13px;color:var(--t3);margin-top:2px}
.content{padding:8px 20px 24px;display:flex;flex-direction:column;gap:16px}

/* Hero stats */
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hs{background:linear-gradient(135deg,rgba(124,58,237,.12),rgba(236,72,153,.06));
  border:1px solid var(--bd);border-radius:20px;padding:18px 16px}
.hs-icon{font-size:22px;margin-bottom:8px;display:block}
.hs-val{font-size:30px;font-weight:900;letter-spacing:-.05em;line-height:1}
.hs-val span{font-size:14px;font-weight:500;color:var(--t3)}
.hs-lbl{font-size:12px;color:var(--t3);font-weight:500;margin-top:4px}
.hs-sub{font-size:11px;color:var(--tm);margin-top:2px}

/* Reto card */
.reto-card{background:var(--card);border:1px solid var(--bd);
  border-radius:24px;padding:20px;display:flex;align-items:center;gap:16px}
.reto-ring{position:relative;width:80px;height:80px;flex-shrink:0}
.reto-ring svg{transform:rotate(-90deg)}
.rt{fill:none;stroke:var(--tm);stroke-width:6}
.rf{fill:none;stroke:url(#rg);stroke-width:6;stroke-linecap:round;
  transition:stroke-dashoffset .8s ease}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.rc-pct{font-size:17px;font-weight:800;letter-spacing:-.04em;line-height:1}
.rc-lbl{font-size:9px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.reto-info .reto-title{font-size:16px;font-weight:800;letter-spacing:-.02em;margin-bottom:5px}
.reto-phase{font-size:12px;color:var(--pl);font-weight:600;
  background:rgba(124,58,237,.12);border:1px solid rgba(196,181,253,.2);
  display:inline-block;padding:2px 10px;border-radius:20px;margin-bottom:5px}
.reto-sessions{font-size:13px;color:var(--t3)}

/* Timeline */
.tl-card{background:var(--card);border:1px solid var(--su);border-radius:20px;padding:16px}
.tl-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tl-title{font-size:14px;font-weight:700}
.tl-badge{font-size:11px;font-weight:700;color:var(--pl);
  background:rgba(124,58,237,.12);border:1px solid rgba(196,181,253,.2);
  padding:3px 10px;border-radius:20px}
.tl-segs{display:flex;gap:3px;margin-bottom:8px}
.ts{height:6px;border-radius:3px;background:var(--tm);flex:1;transition:background .3s}
.ts.d{background:var(--pri)}
.ts.a{background:linear-gradient(90deg,var(--pri),var(--acc));
  box-shadow:0 0 6px rgba(124,58,237,.5)}
.wk-labels{display:flex;justify-content:space-between;
  font-size:10px;color:var(--tm);font-weight:600;letter-spacing:.04em}

/* Week */
.wk-card{background:var(--card);border:1px solid var(--su);border-radius:20px;padding:16px}
.wk-days{display:flex;justify-content:space-between;gap:6px;margin-bottom:10px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.wdc{width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;border:2px solid;transition:all .3s}
.wdc.ok{background:linear-gradient(135deg,var(--pri),var(--acc));
  border-color:transparent;color:#fff;box-shadow:0 0 12px rgba(124,58,237,.4)}
.wdc.now{background:rgba(124,58,237,.15);border-color:var(--pri);
  color:var(--pl);box-shadow:0 0 8px rgba(124,58,237,.3)}
.wdc.past{background:transparent;border-color:var(--tm);color:var(--tm)}
.wdc.fut{background:var(--card);border-color:var(--su);color:var(--tm)}
.wd-lbl{font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.04em;color:var(--tm)}
.wd-lbl.hi{color:var(--t3)}.wd-lbl.a{color:var(--pl)}
.wk-bar{height:4px;background:var(--tm);border-radius:2px;overflow:hidden}
.wk-bar-fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--acc));
  border-radius:2px;transition:width .8s ease}
.wk-info{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-top:6px}

/* PRs */
.sec-title{font-size:16px;font-weight:800;letter-spacing:-.02em}
.sec-sub{font-size:13px;color:var(--t3);margin-top:2px;margin-bottom:12px}
.pr-list{display:flex;flex-direction:column;gap:8px}
.pr-item{display:flex;align-items:center;gap:12px;padding:14px 16px;
  background:var(--card);border:1px solid var(--su);border-radius:16px}
.pr-icon{font-size:20px;flex-shrink:0}
.pr-name{font-size:14px;font-weight:700;letter-spacing:-.01em}
.pr-date{font-size:11px;color:var(--t3);margin-top:1px}
.pr-val{font-size:20px;font-weight:800;letter-spacing:-.03em;color:var(--pl)}
.pr-unit{font-size:11px;color:var(--t3);font-weight:500}

/* Photos */
.ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph-slot{aspect-ratio:3/4;border-radius:16px;background:var(--el);
  border:1.5px dashed rgba(124,58,237,.3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;cursor:pointer;transition:border-color .2s;position:relative;overflow:hidden}
.ph-slot:active{border-color:var(--pri)}
.ph-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph-icon{font-size:28px;opacity:.4}
.ph-lbl{font-size:12px;color:var(--t3);font-weight:600;text-align:center}

/* Empty */
.empty{text-align:center;padding:32px 20px;
  display:flex;flex-direction:column;align-items:center;gap:10px}
.empty-icon{font-size:48px}
.empty-title{font-size:18px;font-weight:800;letter-spacing:-.02em}
.empty-sub{font-size:14px;color:var(--t3);line-height:1.6;max-width:260px}
.empty-cta{padding:12px 24px;border-radius:14px;border:none;
  background:linear-gradient(135deg,var(--pri),#9333ea);
  color:#fff;font-family:var(--f);font-size:14px;font-weight:700;
  cursor:pointer;text-decoration:none;margin-top:4px}

/* Nav */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:var(--mx);height:calc(var(--nav)+env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:rgba(13,8,20,.95);
  backdrop-filter:blur(20px);border-top:1px solid var(--su);
  display:flex;align-items:flex-start;z-index:100}
.nav-items{width:100%;display:flex;justify-content:space-around;padding-top:8px}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 12px;text-decoration:none;-webkit-tap-highlight-color:transparent}
.nav-icon{font-size:22px;line-height:1}
.nav-label{font-size:10px;font-weight:600;letter-spacing:.04em;
  color:var(--tm);font-family:var(--f)}
.nav-item.active .nav-label{color:var(--pl)}
.nav-center{display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:0 12px;padding-top:4px;text-decoration:none}
.nav-center-icon{width:46px;height:46px;border-radius:16px;
  background:linear-gradient(135deg,var(--pri),#9333ea);
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 4px 16px rgba(124,58,237,.5);margin-top:-14px}
.nav-center-lbl{font-size:10px;font-weight:600;color:var(--pl);font-family:var(--f)}
.ldr{position:fixed;inset:0;background:var(--bg);z-index:999;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .3s,visibility .3s}
.ldr.off{opacity:0;visibility:hidden;pointer-events:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes cam-breathe{
  0%,100%{box-shadow:0 0 20px rgba(139,92,246,.5),0 0 40px rgba(236,72,153,.2),0 0 0 8px rgba(139,92,246,.08);}
  50%{box-shadow:0 0 32px rgba(139,92,246,.7),0 0 60px rgba(236,72,153,.35),0 0 0 12px rgba(139,92,246,.12);}
}
.scroll{scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
</style>

<script>
// Safety: si el loader sigue visible después de 6s → mostrar página
setTimeout(function() {
  var ldr = document.getElementById('ldr');
  if (ldr && ldr.style.display !== 'none' && !ldr.classList.contains('off')) {
    ldr.style.display = 'none';
    ldr.classList.add('off');
    console.warn('[AF] Safety timeout triggered on', window.location.pathname);
  }
}, 6000);
</script>

      arjuEl.textContent = msgs;

  });
}

function handleProgressPhoto(input) {

  var type = window._photoType || 'antes';
  var reader = new FileReader();
  reader.onload = function(e) {
    var b64 = e.target.result;
    // Guardar en localStorage
    localStorage.setItem('af-progress-photo-' + type, b64);
    localStorage.setItem('af-progress-photo-' + type + '-date',
      new Date().toLocaleDateString('es-CO', {day:'numeric',month:'short',year:'numeric'}));

}

function renderPhotoSlots() {
  var slots = ['antes','despues'];

async function saveMedidas() {
  var fields = [
    ['af-medida-peso','weight_kg'],
    ['af-medida-cintura','waist_cm'],
    ['af-medida-cadera','hip_cm'],
  ];
  var changed = false;
  var payload = { updated_at: new Date().toISOString() };
  fields.forEach(function([id, col]) {
    var el = document.getElementById('m_' + id);
    if (!el) return;
    var val = parseFloat(el.value);
    if (!isNaN(val) && val > 0) {
      localStorage.setItem(id, val);
      payload[col] = val;
      changed = true;
    }
  });

  if (!changed) { document.getElementById('medidas-sheet')?.remove(); return; }

  // Guardar en Supabase
  try {
    var sess = await _sb.auth.getSession();
    var uid = sess?.data?.session?.user?.id;
    if (uid) {
      payload.id = uid;
      await _sb.from('profiles').upsert(payload, { onConflict: 'id' });
    }
  } catch(e) { /* offline fallback ok */ }

  document.getElementById('medidas-sheet')?.remove();
  renderMedidasCard();
  showProgressToast('✅ Medidas guardadas');
}

function renderMedidasCard() {
  var el = document.getElementById('medidas-card-vals');
  if (!el) return;
  var peso    = localStorage.getItem('af-medida-peso')    || '—';
  var cintura = localStorage.getItem('af-medida-cintura') || '—';
  var cadera  = localStorage.getItem('af-medida-cadera')  || '—';
  el.innerHTML =
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">' +
    [['⚖️','Peso',peso,'kg'],['📏','Cintura',cintura,'cm'],['📐','Cadera',cadera,'cm']].map(function(x){
      return '<div style="text-align:center"><div style="font-size:11px;color:rgba(255,255,255,.3);margin-bottom:4px">'+x[0]+' '+x[1]+'</div>' +
        '<div style="font-size:22px;font-weight:800;color:#f1f0f4">' + x[2] + '</div>' +
        (x[2]!=='—'?'<div style="font-size:10px;color:rgba(255,255,255,.3)">'+x[3]+'</div>':'') + '</div>';
    }).join('') + '</div>';
}

// ════════════════════════════════════════════════════════════
// Cierre del día — Daily closure flow
// ════════════════════════════════════════════════════════════

var _closureStep = 0;
var _closureAnswers = {};

function openDailyClosure() {
  _closureStep = 0;
  _closureAnswers = {};
  var modal = document.getElementById('closureModal');
  if (!modal) {
    buildClosureModal();
    modal = document.getElementById('closureModal');
  }
  if (modal) {
    modal.style.display = 'flex';
    showClosureStep(0);
  }
}

function buildClosureModal() {
  var div = document.createElement('div');
  div.id = 'closureModal';
  div.style.cssText = 'display:none;position:fixed;inset:0;z-index:600;background:rgba(7,2,15,.92);' +
    'backdrop-filter:blur(20px);align-items:flex-end;justify-content:center;font-family:var(--font,Outfit,sans-serif)';
  div.innerHTML =
    '<div style="width:100%;max-width:430px;background:#10071d;border-radius:24px 24px 0 0;' +
    'padding:24px 20px calc(env(safe-area-inset-bottom) + 24px);max-height:85vh;overflow-y:auto">' +
      '<div style="width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);' +
        'margin:0 auto 20px"></div>' +
      '<div id="closureContent"></div>' +
    '</div>';
  div.addEventListener('click', function(e) {
    if (e.target === div) closeClosureModal();
  });
  document.body.appendChild(div);
}

function closeClosureModal() {
  var modal = document.getElementById('closureModal');
  if (modal) modal.style.display = 'none';
}

var CLOSURE_STEPS = [
  {
    q: '¿Cómo te fue hoy?',
    key: 'mood',
    opts: [
      {label:'😊 Bien', val:'bien'},
      {label:'😐 Regular', val:'regular'},
      {label:'😓 Difícil', val:'dificil'},
      {label:'💤 No pude', val:'no_pude'},
    ]
  },
  {
    q: '¿Qué sí hiciste hoy?',
    key: 'wins',
    multi: true,
    opts: [
      {label:'🏋️ Entrené', val:'workout'},
      {label:'🥗 Registré comida', val:'food'},
      {label:'🍳 Comí mejor', val:'ate_well'},
      {label:'🚶 Me moví más', val:'moved'},
      {label:'🤖 Hablé con Arju', val:'arju'},
      {label:'💤 Nada todavía', val:'nothing'},
    ]
  },
  {
    q: '¿Qué quieres hacer mañana?',
    key: 'tomorrow',
    opts: [
      {label:'🏋️ Entrenar', val:'workout'},
      {label:'🥗 Comer mejor', val:'food'},
      {label:'📝 Registrar comida', val:'log_food'},
      {label:'🔄 Volver al ritmo', val:'return'},
      {label:'🌿 Algo suave', val:'gentle'},
    ]
  }
];

var _multiSelected = {};

function showClosureStep(step) {
  _multiSelected = {};
  var s = CLOSURE_STEPS[step];
  if (!s) { showClosureResult(); return; }
  var cont = document.getElementById('closureContent');
  if (!cont) return;

  var optsHTML = s.opts.map(function(o) {
    return '<button onclick="selectClosureOpt(this,\'' + o.val + '\',' + (s.multi ? 'true' : 'false') + ')" ' +
      'data-val="' + o.val + '" ' +
      'style="width:100%;text-align:left;padding:13px 16px;background:rgba(255,255,255,.05);' +
      'border:1px solid rgba(255,255,255,.08);border-radius:14px;color:#f5f3ff;font-size:14px;' +
      'cursor:pointer;margin-bottom:8px;font-family:var(--font,Outfit,sans-serif)">' +
      o.label + '</button>';
  }).join('');

  var nextLabel = step === CLOSURE_STEPS.length - 1 ? 'Ver mi cierre' : 'Continuar';

  cont.innerHTML =
    '<div style="font-size:11px;color:rgba(196,181,253,.5);font-weight:700;text-transform:uppercase;' +
      'letter-spacing:.06em;margin-bottom:8px">' + (step+1) + ' de ' + CLOSURE_STEPS.length + '</div>' +
    '<div style="font-size:18px;font-weight:800;color:#f5f3ff;margin-bottom:18px">' + s.q + '</div>' +
    '<div id="closureOpts">' + optsHTML + '</div>' +
    '<button onclick="nextClosureStep(' + step + ')" ' +
      'style="width:100%;padding:14px;background:linear-gradient(135deg,#8b5cf6,#a855f7,#ec4899);' +
      'border:none;border-radius:14px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px">' +
      nextLabel +
    '</button>';
}

function selectClosureOpt(btn, val, multi) {
  if (!multi) {
    document.querySelectorAll('#closureOpts button').forEach(function(b) {
      b.style.borderColor = 'rgba(255,255,255,.08)';
      b.style.background = 'rgba(255,255,255,.05)';
    });
    btn.style.borderColor = 'rgba(168,85,247,.5)';
    btn.style.background = 'rgba(139,92,246,.18)';
    _closureAnswers[CLOSURE_STEPS[_closureStep].key] = val;
    _multiSelected = { [val]: true };
  } else {
    var active = _multiSelected[val];
    _multiSelected[val] = !active;
    btn.style.borderColor = !active ? 'rgba(168,85,247,.5)' : 'rgba(255,255,255,.08)';
    btn.style.background = !active ? 'rgba(139,92,246,.18)' : 'rgba(255,255,255,.05)';
    _closureAnswers.wins = Object.keys(_multiSelected).filter(function(k) { return _multiSelected[k]; });
  }
}

function nextClosureStep(currentStep) {
  _closureStep = currentStep + 1;
  showClosureStep(_closureStep);
}

function showClosureResult() {
  var mood = _closureAnswers.mood || 'regular';
  var wins = _closureAnswers.wins || [];
  var tomorrow = _closureAnswers.tomorrow || 'return';
  var cont = document.getElementById('closureContent');
  if (!cont) return;

  var arjuMsg = buildClosureArjuMsg(mood, wins, tomorrow);

  cont.innerHTML =
    '<div style="text-align:center;margin-bottom:20px">' +
      '<div style="font-size:40px;margin-bottom:8px">🌙</div>' +
      '<div style="font-size:18px;font-weight:800;color:#f5f3ff">Día cerrado</div>' +
    '</div>' +
    '<div style="background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.2);' +
      'border-radius:16px;padding:16px;margin-bottom:18px">' +
      '<div style="font-size:11px;color:#a78bfa;font-weight:700;text-transform:uppercase;' +
        'letter-spacing:.06em;margin-bottom:8px">Arju</div>' +
      '<div style="font-size:14px;color:rgba(240,238,248,.8);line-height:1.7">' + arjuMsg + '</div>' +
    '</div>' +
    '<div style="font-size:12px;color:rgba(255,255,255,.35);text-align:center;margin-bottom:16px">' +
      'Mañana no empiezas de cero.' +
    '</div>' +
    '<button onclick="saveDailyClosureAndClose()" ' +
      'style="width:100%;padding:14px;background:linear-gradient(135deg,#8b5cf6,#a855f7,#ec4899);' +
      'border:none;border-radius:14px;color:#fff;font-size:14px;font-weight:700;cursor:pointer">' +
      'Listo, cerrar día' +
    '</button>';

  saveDailyClosure(mood, wins, tomorrow, arjuMsg);
}

function buildClosureArjuMsg(mood, wins, tomorrow) {
  var nothingDone = wins.length === 0 || wins.includes('nothing');
  var didWorkout  = wins.includes('workout');
  var didFood     = wins.includes('food') || wins.includes('ate_well');
  var didArju     = wins.includes('arju');

  if (nothingDone || mood === 'no_pude') {
    return 'No empezamos de cero. Mañana solo necesito que hagas una cosa: abrir la app y registrar una comida. Eso ya mantiene vivo el proceso.';
  }
  if (didWorkout && didFood) {
    return 'Hoy apareciste y cuidaste tu alimentación. Eso es exactamente lo que construye resultados reales. Mañana: recuperación y otra comida con proteína.';
  }
  if (didWorkout) {
    return 'Completaste tu entrenamiento. Eso ya es mucho. Mañana cuida la comida y el descanso. El músculo crece mientras descansas.';
  }
  if (didFood) {
    return 'Registraste comida y eso ya le da dirección a tu día. Mañana suma una acción de movimiento, aunque sea suave.';
  }
  if (mood === 'dificil') {
    return 'Los días difíciles también cuentan. Volviste a mirar tu proceso y eso ya es una victoria. Mañana con calma, una acción pequeña.';
  }
  return 'Hoy hiciste algo. Eso mantiene vivo el proceso. Mañana seguimos con una acción pequeña hacia tu objetivo.';
}

async function saveDailyClosure(mood, wins, tomorrow, arjuMsg) {
  var sb = window._sb;
  var uid = localStorage.getItem('af-uid');
  if (!sb || !uid) return;
  try {
    await sb.from('daily_closures').upsert({
      user_id: uid,
      date: localDateKey(),
      mood: mood,
      selected_wins: wins,
      tomorrow_focus: tomorrow,
      arju_reflection: arjuMsg,
    }, { onConflict: 'user_id,date' });
    if (window.AF) window.AF.track('daily_closure_completed', { mood: mood, wins: wins.length });
  } catch(e) {
    console.warn('[Closure] save failed:', e.message);
  }
}

function saveDailyClosureAndClose() {
  closeClosureModal();
  // Show microvictoria
  var mv = window.AF_Microvictoria || window.showMicrovictoria;
  if (typeof mv === 'function') {
    mv({ emoji: '🌙', title: 'Día cerrado', message: 'Mañana no empiezas de cero.' });
  }
}

window.openDailyClosure = openDailyClosure;

</script>

<script>
function afNavRegister() {
  var btn = document.getElementById('af-reg-btn');
  var ripple = document.getElementById('af-ripple');
  btn.style.animation = 'none';
  btn.style.transform = 'scale(.88) rotate(-8deg)';
  setTimeout(function(){ btn.style.transform='scale(1.08) rotate(4deg)'; }, 120);
  setTimeout(function(){ btn.style.transform=''; btn.style.animation='nav-pulse 3s ease-in-out infinite'; }, 300);
  if (ripple) {
    for (var i=0;i<3;i++) {
      (function(d){ setTimeout(function(){
        var r=document.createElement('div');
        r.style.cssText='position:absolute;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.3);top:50%;left:50%;animation:nav-ripple .6s ease-out forwards';
        ripple.appendChild(r); setTimeout(function(){ r.remove(); },700);
      },d); })(i*80);
    }
  }
  setTimeout(function(){
    if(typeof openCamera==='function') openCamera();
    else window.location.href='/pages/nutrition.html?camera=1';
  },150);
}

// ── Active page — por ID, limpia todo primero ──────────
(function(){
  var path = window.location.pathname;
  var MAP = {
    'dashboard': { id:'nav-inicio', color:'#a78bfa', glow:'rgba(124,58,237,.5)' },
    'workout':   { id:'nav-entrena', color:'#c4b5fd', glow:'rgba(139,92,246,.5)' },
    'coach':     { id:'nav-coach',   color:'#93c5fd', glow:'rgba(59,130,246,.5)' },
    'nutrition': { id:'nav-nutr',    color:'#6ee7b7', glow:'rgba(16,185,129,.5)' },
  };
  var match = Object.keys(MAP).find(function(k){ return path.includes(k); });
  if (!match) return;
  var cfg = MAP[match];
  var el = document.getElementById(cfg.id);
  if (!el) return;
  var svg = el.querySelector('svg');
  var lbl = el.querySelector('span');
  var dot = el.querySelectorAll('div');
  if (svg) svg.setAttribute('stroke', cfg.color);
  if (lbl) { lbl.style.color=cfg.color; lbl.style.fontWeight='800'; }
  if (dot.length) { var d=dot[dot.length-1]; d.style.background=cfg.glow; d.style.boxShadow='0 0 6px '+cfg.glow; }
})();

function renderDayState() {
  // Refresh progress page with latest data
  var container = document.getElementById('main') || document.getElementById('progress-content');
  if (!container) return;
  if (typeof emptyHTML === 'function') {
    container.innerHTML = emptyHTML();
  }
}
// Auto-refresh on visibility change
document.addEventListener('visibilitychange', function() {
  if (!document.hidden && typeof renderDayState === 'function') renderDayState();
});
</script>
