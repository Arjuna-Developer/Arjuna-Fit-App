<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32-v2.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6D28FF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ArjunaFit">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="af-version" content="mini-beta-day1-war-room-v1">
<title>Biblioteca · ArjunaFit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/visual-system.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --bg:#08050f;--bg-card:rgba(17,12,28,.9);--border:rgba(255,255,255,.07);
  --text:#f1f0f4;--text-2:rgba(240,238,248,.7);--text-3:rgba(240,238,248,.4);
  --accent:#7c3aed;--font:'Outfit',sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow-x:hidden}

.page{
  max-width:430px;margin:0 auto;
  padding:calc(var(--safe-top) + 16px) 16px calc(100px + var(--safe-bot));
  min-height:100dvh;
}

.hdr{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.hdr-back{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;
  border:1px solid var(--border);background:rgba(255,255,255,.04);
  color:var(--text-3);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none}
.hdr-title{font-size:18px;font-weight:800;letter-spacing:-.02em}

/* Filter chips */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;
  scrollbar-width:none;-ms-overflow-style:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;
  border:1px solid var(--border);background:rgba(255,255,255,.04);
  color:var(--text-3);font-size:12px;font-weight:700;cursor:pointer;
  transition:all .2s;white-space:nowrap}
.chip.on{background:rgba(124,58,237,.2);color:#c4b5fd;border-color:rgba(124,58,237,.35)}

/* Search */
.search-wrap{position:relative;margin-bottom:16px}
.search-wrap input{width:100%;padding:11px 16px 11px 40px;border-radius:14px;
  border:1px solid var(--border);background:rgba(255,255,255,.04);
  color:var(--text);font-family:var(--font);font-size:13px;outline:none;
  -webkit-appearance:none}
.search-wrap input::placeholder{color:var(--text-3)}
.search-wrap .sico{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:14px;opacity:.4;pointer-events:none}

/* Exercise grid */
.ex-grid{display:flex;flex-direction:column;gap:10px}

.ex-card{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;
  padding:16px;cursor:pointer;transition:border-color .2s,box-shadow .2s;
  display:flex;align-items:center;gap:14px}
.ex-card:hover,.ex-card:active{border-color:rgba(124,58,237,.3);
  box-shadow:0 4px 20px rgba(124,58,237,.1)}

.ex-thumb{width:52px;height:52px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,rgba(124,58,237,.2),rgba(236,72,153,.15));
  border:1px solid rgba(124,58,237,.2);
  display:flex;align-items:center;justify-content:center;font-size:22px;
  position:relative;overflow:hidden}
.ex-thumb.pending::after{
  content:'▶';position:absolute;bottom:4px;right:4px;
  font-size:8px;background:rgba(255,255,255,.1);border-radius:4px;
  padding:1px 3px;color:rgba(255,255,255,.4)}

.ex-body{flex:1;min-width:0}
.ex-easy{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.01em;margin-bottom:2px}
.ex-tech{font-size:11px;color:var(--text-3);margin-bottom:7px}
.ex-pills{display:flex;gap:6px;flex-wrap:wrap}
.ex-pill{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:600}
.pill-muscle{background:rgba(124,58,237,.12);color:#c4b5fd}
.pill-pending{background:rgba(255,255,255,.05);color:var(--text-3)}
.pill-avail{background:rgba(52,211,153,.1);color:#6ee7b7}
.pill-level{background:rgba(245,158,11,.08);color:rgba(253,186,116,.7)}

.empty-state{text-align:center;padding:40px 20px}
.empty-state .ico{font-size:44px;margin-bottom:12px}
.empty-state .ttl{font-size:16px;font-weight:700;margin-bottom:6px}
.empty-state .sub{font-size:13px;color:var(--text-3);margin-bottom:18px;line-height:1.6}

/* Detail overlay */
.detail-ov{position:fixed;inset:0;z-index:400;background:var(--bg);
  overflow-y:auto;font-family:var(--font)}
.detail-inner{max-width:430px;margin:0 auto;
  padding:calc(var(--safe-top) + 8px) 16px calc(var(--safe-bot) + 40px)}
.detail-back{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;
  border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.04);
  color:var(--text-3);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:20px}
.detail-video-slot{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,rgba(8,5,17,.9),rgba(20,10,40,.9));
  border:1px solid rgba(124,58,237,.18);border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;margin-bottom:20px;position:relative;overflow:hidden}
.detail-video-slot .play-btn{width:56px;height:56px;border-radius:50%;
  background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;font-size:20px;margin-left:4px}
.detail-section{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--text-3);margin-bottom:8px;margin-top:18px}
.detail-content{background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:14px;padding:14px;font-size:13px;color:var(--text-2);line-height:1.6}
.detail-tip{background:rgba(124,58,237,.07);border:1px solid rgba(196,181,253,.1);
  border-radius:14px;padding:14px;display:flex;gap:10px;align-items:flex-start}
.detail-error{background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.12);
  border-radius:14px;padding:14px;display:flex;gap:10px}
.detail-reg-prog{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-reg{background:rgba(96,165,250,.06);border:1px solid rgba(96,165,250,.12);
  border-radius:12px;padding:12px}
.detail-prog{background:rgba(52,211,153,.05);border:1px solid rgba(52,211,153,.1);
  border-radius:12px;padding:12px}
.detail-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  margin-bottom:5px}
.detail-reg .detail-label{color:rgba(147,197,253,.5)}
.detail-prog .detail-label{color:rgba(110,231,183,.5)}
.detail-reg p,.detail-prog p{font-size:12px;color:var(--text-2);line-height:1.5}

/* Nav */
nav{position:fixed;bottom:calc(12px + var(--safe-bot));left:50%;transform:translateX(-50%);
  width:min(calc(100vw - 24px),406px);height:56px;
  background:rgba(13,9,26,.88);border:1px solid rgba(255,255,255,.09);
  border-radius:22px;display:flex;align-items:center;justify-content:space-around;
  backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);z-index:200}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 12px;cursor:pointer;opacity:.45;transition:opacity .2s;
  color:var(--text);text-decoration:none;border:none;background:none}
.nav-btn svg{width:22px;height:22px}
.nav-btn span{font-size:9px;font-weight:600;letter-spacing:.04em}
.nav-btn.active{opacity:1;color:#c4b5fd}
</style>
  <script src="/js/core/auth-bootstrap.js"></script>
<script src="/js/core/ops-config.js"></script>
<script src="/js/core/analytics.js"></script>
  <script src="/js/core/trial-guard.js"></script>
</head>
<body>
<div class="page">
  <!-- Header -->
  <div class="hdr">
    <a href="/pages/workout.html" class="hdr-back">← Atrás</a>
    <div>
      <div class="hdr-title">Biblioteca</div>
      <div style="font-size:11px;color:rgba(255,255,255,.3)">15 ejercicios</div>
    </div>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <span class="sico">🔍</span>
    <input type="search" id="libSearch" placeholder="Busca: glúteo, plancha, banca…"
      oninput="filterLib()" style="color:#f1f0f4">
  </div>

  <!-- Filters -->
  <div class="filters" id="filterRow">
    <button class="chip on" data-cat="all" onclick="setCat('all',this)">Todo</button>
    <button class="chip" data-cat="gluteos" onclick="setCat('gluteos',this)">🍑 Glúteos</button>
    <button class="chip" data-cat="core" onclick="setCat('core',this)">🔥 Core</button>
    <button class="chip" data-cat="piernas" onclick="setCat('piernas',this)">🦵 Piernas</button>
    <button class="chip" data-cat="espalda" onclick="setCat('espalda',this)">💪 Espalda</button>
    <button class="chip" data-cat="pecho" onclick="setCat('pecho',this)">🏋️ Pecho</button>
    <button class="chip" data-cat="hombros" onclick="setCat('hombros',this)">⬆️ Hombros</button>
  </div>

  <!-- Exercise grid -->
  <div class="ex-grid" id="exGrid"></div>
  <div class="empty-state" id="libEmpty" style="display:none">
    <div class="ico">🏋️</div>
    <div class="ttl">No encontré ese ejercicio.</div>
    <div class="sub">Prueba buscar: glúteo, plancha, banca o jalón.</div>
    <button onclick="clearSearch()" style="padding:10px 20px;border-radius:12px;border:none;cursor:pointer;background:rgba(124,58,237,.2);color:#c4b5fd;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700">Ver todos</button>
  </div>
</div>

<!-- Exercise detail overlay (rendered by JS) -->

<!-- Nav -->
<nav>
  <a href="/pages/dashboard.html" class="nav-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
    <span>Inicio</span>
  </a>
  <a href="/pages/workout.html" class="nav-btn active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14M18 5v14"/><path d="M2 9h4M18 9h4M2 15h4M18 15h4"/><path d="M6 12h12"/></svg>
    <span>Entrena</span>
  </a>
  <a href="/pages/nutrition.html" class="nav-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8 2 4 5.5 4 10c0 4 3 7 6 8v4h4v-4c3-1 6-4 6-8 0-4.5-4-8-8-8z"/><path d="M9 10c0-1.7 1.3-3 3-3"/></svg>
    <span>Nutrición</span>
  </a>
  <a href="/pages/coach.html" class="nav-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a8 8 0 018 8c0 3-1.7 5.6-4.2 7L12 22l-3.8-5C5.7 15.6 4 13 4 10a8 8 0 018-8z"/><circle cx="12" cy="10" r="2.5" fill="currentColor" stroke="none"/></svg>
    <span>Coach</span>
  </a>
  <a href="/pages/progress.html" class="nav-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 20V14l4-4 4 4 4-6 4 4"/></svg>
    <span>Progreso</span>
  </a>
</nav>

<script src="/js/core/exercise-library.js"></script>
<script>
const EMOJIS = { gluteos:'🍑', core:'🔥', piernas:'🦵', espalda:'💪', pecho:'🏋️', hombros:'⬆️', general:'💪' };
const LEVEL_LABEL = { principiante:'Principiante', intermedio:'Intermedio', avanzado:'Avanzado' };
let _cat = 'all', _q = '';

function getExercises() {
  return Object.values(window.EXERCISE_LIBRARY || {})
    .filter(e => typeof e === 'object' && e.id);
}

function renderGrid() {
  let exs = getExercises();
  if (_cat !== 'all') exs = exs.filter(e => e.category === _cat);
  if (_q) exs = exs.filter(e =>
    e.easy.toLowerCase().includes(_q) ||
    e.technical.toLowerCase().includes(_q) ||
    (e.primary_muscle||'').toLowerCase().includes(_q));

  const grid = document.getElementById('exGrid');
  const empty = document.getElementById('libEmpty');
  if (!exs.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  grid.innerHTML = exs.map(e => {
    const avail = e.video_status === 'available';
    const emoji = EMOJIS[e.category] || '💪';
    return '<div class="ex-card" onclick="openDetail(\'' + e.id + '\')">' +
      '<div class="ex-thumb' + (avail ? '' : ' pending') + '">' + emoji + '</div>' +
      '<div class="ex-body">' +
        '<div class="ex-easy">' + e.easy + '</div>' +
        '<div class="ex-tech">' + e.technical + '</div>' +
        '<div class="ex-pills">' +
          '<span class="ex-pill pill-muscle">' + e.primary_muscle + '</span>' +
          '<span class="ex-pill ' + (avail ? 'pill-avail' : 'pill-pending') + '">' +
            (avail ? '▶ Video' : '⏳ Próximamente') + '</span>' +
          '<span class="ex-pill pill-level">' + (LEVEL_LABEL[e.level] || e.level) + '</span>' +
        '</div>' +
      '</div></div>';
  }).join('');
}

function setCat(cat, btn) {
  _cat = cat;
  document.querySelectorAll('.chip').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  renderGrid();
}

function filterLib() {
  _q = document.getElementById('libSearch').value.toLowerCase().trim();
  renderGrid();
}

function clearSearch() {
  _q = ''; _cat = 'all';
  document.getElementById('libSearch').value = '';
  document.querySelectorAll('.chip').forEach((b,i) => b.classList.toggle('on', i===0));
  renderGrid();
}

function openDetail(id) {
  const e = window.EXERCISE_LIBRARY[id];
  if (!e) return;
  const existing = document.getElementById('detail-ov');
  if (existing) existing.remove();

  const ov = document.createElement('div');
  ov.id = 'detail-ov';
  ov.className = 'detail-ov';
  document.body.appendChild(ov);
  document.getElementById('det-back').addEventListener('click', function() { document.getElementById('detail-ov').remove(); });

  const videoSlot = (e.video_status === 'available' && e.video_url)
    ? '<video preload="none" controls playsinline style="width:100%;aspect-ratio:16/9;border-radius:16px;margin-bottom:20px;object-fit:cover;background:#000" src="' + e.video_url + '"></video>'
    : '<div class="detail-video-slot"><div class="play-btn">▶</div>' +
      '<div style="text-align:center"><div style="font-size:13px;font-weight:600;color:rgba(240,238,248,.5)">' + e.easy + '</div>' +
      '<div style="font-size:10px;color:rgba(255,255,255,.2);margin-top:3px">Video próximamente</div></div></div>';

  ov.innerHTML =
    '<div class="detail-inner">' +
      '<button id="det-back" class="detail-back">← Biblioteca</button>' +
      videoSlot +
      '<div style="font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px">' + e.easy + '</div>' +
      '<div style="font-size:13px;color:rgba(255,255,255,.4);margin-bottom:16px">' + e.technical + ' · ' + e.primary_muscle + '</div>' +

      '<div class="detail-section">Cómo hacerlo</div>' +
      '<div class="detail-content"><b style="color:#f1f0f4;font-size:12px;display:block;margin-bottom:4px">Posición inicial:</b>' + (e.setup||'—') +
      '<br><br><b style="color:#f1f0f4;font-size:12px;display:block;margin-bottom:4px">Ejecución:</b>' + (e.execution||'—') +
      (e.breathing ? '<br><br><b style="color:#f1f0f4;font-size:12px;display:block;margin-bottom:4px">Respiración:</b>' + e.breathing : '') +
      '</div>' +

      '<div class="detail-section">Tip de Arju</div>' +
      '<div class="detail-tip"><span style="font-size:20px;flex-shrink:0">💡</span>' +
      '<span style="font-size:13px;color:rgba(196,181,253,.75);line-height:1.6">' + e.arju_tip + '</span></div>' +

      '<div class="detail-section">Error más común</div>' +
      '<div class="detail-error"><span style="font-size:20px;flex-shrink:0">⚠️</span>' +
      '<span style="font-size:13px;color:rgba(252,165,165,.7);line-height:1.6">' + e.common_mistake + '</span></div>' +

      (e.regression || e.progression ? '<div class="detail-section">Progresión</div><div class="detail-reg-prog">' +
        (e.regression ? '<div class="detail-reg"><div class="detail-label">Si es difícil</div><p>' + e.regression + '</p></div>' : '') +
        (e.progression ? '<div class="detail-prog"><div class="detail-label">Para avanzar</div><p>' + e.progression + '</p></div>' : '') +
      '</div>' : '') +

      '<div style="height:20px"></div>' +
    '</div>';
}

document.addEventListener('DOMContentLoaded', function() {
  renderGrid();
  document.getElementById('exGrid').addEventListener('click', function(ev) {
    var card = ev.target.closest('[data-exid]');
    if (card) openDetail(card.dataset.exid);
  });
});
</script>
</body>
</html>
