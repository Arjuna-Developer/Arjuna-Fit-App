<style>
:root {
  --bg-base:        #0c0714;
  --bg-card:        #130d22;
  --bg-elevated:    #1a1030;
  --bg-input:       #1f1438;
  --primary:        #7c3aed;
  --primary-light:  #c4b5fd;
  --accent:         #ec4899;
  --accent-light:   #f9a8d4;
  --success:        #10b981;
  --text-primary:   #f1f0f4;
  --text-secondary: #c4b5fd;
  --text-tertiary:  #7c6fa0;
  --text-muted:     #3d3258;
  --border-base:    rgba(124, 58, 237, 0.18);
  --border-subtle:  rgba(255, 255, 255, 0.05);
  --font-display:   'Outfit', sans-serif;
  --max-w:          430px;
  --header-h:       60px;
  --input-h:        72px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--font-display);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

#app {
  max-width: var(--max-w);
  margin: 0 auto;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ────────────────────────────────────────────────
   HEADER
──────────────────────────────────────────────── */
.coach-header {
  height: var(--header-h);
  padding: calc(env(safe-area-inset-top) + 10px) 20px 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: linear-gradient(to bottom, var(--bg-base), transparent);
  position: relative;
  z-index: 2;
  flex-shrink: 0;
}

.header-back {
  width: 36px; height: 36px;
  border-radius: 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  cursor: pointer;
  text-decoration: none;
  flex-shrink: 0;
  transition: transform 0.15s;
}
.header-back:active { transform: scale(0.9); }

.coach-header-info { flex: 1; }
.coach-header-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1;
}
.coach-header-status {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-top: 2px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 6px var(--success);
  animation: status-pulse 2s ease infinite;
}
@keyframes status-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.coach-avatar-sm {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  box-shadow: 0 0 10px rgba(124,58,237,0.18);
}

/* ────────────────────────────────────────────────
   MESSAGES AREA
──────────────────────────────────────────────── */
.messages-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 8px 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}
.messages-area::-webkit-scrollbar { display: none; }

/* ── Bubble base ── */
.msg {
  display: flex;
  flex-direction: column;
  gap: 3px;
  animation: msg-in 0.3s ease;
  max-width: 85%;
}
@keyframes msg-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.assistant { align-self: flex-start; align-items: flex-start; }

.msg-bubble {
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.6;
  font-weight: 400;
}

.msg.user .msg-bubble {
  background: linear-gradient(135deg, var(--primary), #9333ea);
  color: white;
  border-bottom-right-radius: 6px;
}

.msg.assistant .msg-bubble {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  border-bottom-left-radius: 6px;
}

.msg-time {
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 500;
  padding: 0 4px;
}

/* Typing indicator */
.msg.typing .msg-bubble {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  padding: 14px 18px;
}
.typing-indicator {
  display: flex;
  gap: 5px;
  align-items: center;
}
.typing-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text-tertiary);
  animation: typing-bounce 1.2s ease infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing-bounce {
  0%, 100% { transform: translateY(0); opacity: 0.4; }
  50%       { transform: translateY(-5px); opacity: 1; }
}

/* Quick actions (inicio de chat) */
.quick-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px 0;
  animation: msg-in 0.3s ease 0.2s both;
}
.quick-action-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
}
.quick-action-btn:active {
  transform: scale(0.97);
  border-color: var(--primary);
  background: rgba(124,58,237,0.08);
}
.qa-icon { font-size: 18px; flex-shrink: 0; }

/* ────────────────────────────────────────────────
   INPUT AREA
──────────────────────────────────────────────── */
.input-area {
  flex-shrink: 0;
  padding: 12px 16px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  background: var(--bg-base);
  border-top: 1px solid var(--border-subtle);
}

.input-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--bg-elevated);
  border: 1.5px solid var(--border-subtle);
  border-radius: 20px;
  padding: 8px 8px 8px 14px;
  transition: border-color 0.2s;
}
.input-row.focused { border-color: rgba(124,58,237,0.4); }

.text-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 400;
  color: var(--text-primary);
  resize: none;
  min-height: 24px;
  max-height: 120px;
  line-height: 1.5;
  padding: 2px 0;
  -webkit-appearance: none;
}
.text-input::placeholder { color: var(--text-muted); }

.mic-btn {
  width: 40px; height: 40px;
  border-radius: 14px;
  border: none;
  background: var(--bg-input);
  color: var(--text-tertiary);
  font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.2s;
  position: relative;
}
.mic-btn.listening {
  background: rgba(236,72,153,0.15);
  border: 1.5px solid rgba(236,72,153,0.4);
  color: var(--accent);
}
.mic-btn.processing {
  background: rgba(124,58,237,0.15);
  border: 1.5px solid rgba(124,58,237,0.4);
  color: var(--primary-light);
  animation: mic-process 0.6s ease infinite alternate;
}
@keyframes mic-process {
  from { opacity: 0.7; }
  to   { opacity: 1; }
}

/* Mic pulse rings */
.mic-btn.listening::before,
.mic-btn.listening::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  border: 1.5px solid rgba(236,72,153,0.4);
  animation: mic-ring 1.5s ease-out infinite;
}
.mic-btn.listening::before { width: 52px; height: 52px; }
.mic-btn.listening::after  { width: 64px; height: 64px; animation-delay: 0.3s; }
@keyframes mic-ring {
  from { transform: scale(0.8); opacity: 0.6; }
  to   { transform: scale(1.3); opacity: 0; }
}

.send-btn {
  width: 40px; height: 40px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, var(--primary), #9333ea);
  color: white;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.15s, opacity 0.15s;
  opacity: 0.5;
}
.send-btn.active { opacity: 1; }
.send-btn:active { transform: scale(0.9); }

/* ────────────────────────────────────────────────
   MIC STATUS BAR
──────────────────────────────────────────────── */
.mic-status-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 6px 0 8px;
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
  min-height: 28px;
  transition: all 0.3s;
}
.mic-status-bar.listening { color: var(--accent-light); }
.mic-status-bar.processing { color: var(--primary-light); }

.mic-waves {
  display: flex;
  gap: 3px;
  align-items: center;
  height: 14px;
}
.mic-wave {
  width: 3px;
  background: var(--accent);
  border-radius: 2px;
  animation: wave-bounce 0.6s ease infinite;
  min-height: 4px;
}
.mic-wave:nth-child(1) { animation-delay: 0s; }
.mic-wave:nth-child(2) { animation-delay: 0.1s; }
.mic-wave:nth-child(3) { animation-delay: 0.2s; }
.mic-wave:nth-child(4) { animation-delay: 0.1s; }
.mic-wave:nth-child(5) { animation-delay: 0s; }

@keyframes wave-bounce {
  0%, 100% { height: 4px; }
  50% { height: 14px; }
}

/* ────────────────────────────────────────────────
   INTERIM TRANSCRIPT
──────────────────────────────────────────────── */
.interim-text {
  font-style: italic;
  color: var(--text-muted);
  font-size: 13px;
  padding: 0 4px 6px;
  min-height: 0;
  transition: all 0.2s;
}

/* ────────────────────────────────────────────────
   LOADER
──────────────────────────────────────────────── */
.page-loader {
  position: fixed; inset: 0;
  background: var(--bg-base);
  z-index: 999;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px;
  transition: opacity 0.4s, visibility 0.4s;
}
.page-loader.hide { opacity: 0; visibility: hidden; }

/* ────────────────────────────────────────────────
   TOAST DE PERMISOS
──────────────────────────────────────────────── */
.perm-toast {
  position: fixed;
  bottom: calc(100px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg-elevated);
  border: 1px solid var(--border-base);
  border-radius: 16px;
  padding: 12px 18px;
  font-size: 13px;
  color: var(--text-secondary);
  z-index: 100;
  opacity: 0;
  transition: all 0.3s;
  text-align: center;
  max-width: 280px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.32);
}
.perm-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@keyframes cam-breathe{
  0%,100%{box-shadow:0 0 20px rgba(139,92,246,.5),0 0 40px rgba(236,72,153,.2),0 0 0 8px rgba(139,92,246,.08);}
  50%{box-shadow:0 0 32px rgba(139,92,246,.7),0 0 60px rgba(236,72,153,.35),0 0 0 12px rgba(139,92,246,.12);}
}
.scroll{scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
</style>

<script>
// Hard loader timeout
setTimeout(()=>{const l=document.getElementById('ldr');if(l){l.style.opacity='0';l.style.visibility='hidden';}},2500);

// Unlock audio on first touch anywhere
document.addEventListener('touchstart', unlockAudio, { once: true });
document.addEventListener('click', unlockAudio, { once: true });
// ══════════════════════════════════════════════════
// COACH PAGE — Chat + Auto Micrófono
// ══════════════════════════════════════════════════

let COACH = {
  user: null,
  history: [],
  isProcessing: false,
  recognition: null,
  micActive: false,
  micPaused: false,
  speechSupported: false,
  silenceTimer: null,
  wakeWordActive: false,  // "Arju" wake word mode
  _wakeTimer: null,
};

// ── Helpers ────────────────────────────────────────
function now() {
  return new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
}

function scrollToBottom() {
  const area = document.getElementById('messagesArea');
  setTimeout(() => area.scrollTo({ top: area.scrollHeight, behavior: 'smooth' }), 50);
}

function setStatus(text, type = '') {
  const bar = document.getElementById('micStatusBar');
  const lbl = document.getElementById('micStatusText');
  if (bar) bar.className = `mic-status-bar ${type || ''}` ;
  if (lbl) lbl.textContent = text;
}

function showToast(msg, duration = 3000) {
  const t = document.getElementById('permToast');
  if (t) t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// ── Mensajes ───────────────────────────────────────
function addMessage(role, content, isTyping = false) {
  const area = document.getElementById('messagesArea');
  const div  = document.createElement('div');
  div.className = `msg ${role}${isTyping ? ' typing' : ''}`;
  div.id = isTyping ? 'typingMsg' : `msg_${Date.now()}`;

  if (isTyping) {
    div.innerHTML = `
      <div class="msg-bubble">
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    `;
  } else {
    div.innerHTML = `
      <div class="msg-bubble">${escapeHtml(content)}</div>
      <div class="msg-time">${now()}</div>
    `;
    // Guardar en historial solo mensajes reales
    COACH.history.push({ role: role === 'user' ? 'user' : 'assistant', content });
  }

  area.appendChild(div);
  scrollToBottom();
  return div;
}

function removeTyping() {
  const t = document.getElementById('typingMsg');
  if (t) t.remove();
}

function addQuickActions() {
  const area = document.getElementById('messagesArea');
  const div  = document.createElement('div');
  div.className = 'quick-actions';
  div.id = 'quickActions';

  // Build context-aware quick actions
  var _ctx = window.CoachCtx ? window.CoachCtx.getArjuContext() : {};
  var actions = [
    { icon: '🏋️', text: '¿Qué hago hoy?',         msg: '¿Qué hago hoy con mi entrenamiento?' },
    { icon: '🥗', text: 'Dame una comida fácil',   msg: 'Dame una comida fácil y alta en proteína para hoy.' },
    { icon: '😩', text: 'No tengo ganas',           msg: 'No tengo ganas de nada hoy. ¿Qué me dices?' },
    { icon: '🔄', text: 'Quiero volver',             msg: 'Llevo días sin entrar. Quiero volver. ¿Por dónde empiezo?' },
    { icon: '⚖️', text: '¿Subo peso o repito?', msg: '¿Debería subir el peso hoy o repetir lo de la semana pasada?' },
    { icon: '🌙', text: 'Cerrar mi día', msg: 'Ayúdame a cerrar bien el día.' },
  ];
  // Personalize first action based on context
  if (_ctx.mealsCount === 0) {
    actions[0] = { icon:'🍳', text:'Registrar primera comida', msg:'No he comido nada todavía. Ayúdame a empezar simple.' };
  }
  if (_ctx.daysAbsent >= 2) {
    actions[3] = { icon:'👋', text:'Volver después de ' + _ctx.daysAbsent + ' días', msg:'Estuve ' + _ctx.daysAbsent + ' días sin entrar. ¿Cómo retomo sin sentirme mal?' };
  }

  div.innerHTML = actions.map(a => `
    <button class="quick-action-btn" onclick="sendQuick('${a.msg}')">
      <span class="qa-icon">${a.icon}</span>
      <span>${a.text}</span>
    </button>
  `).join('');

  area.appendChild(div);
  scrollToBottom();
}

function removeQuickActions() {
  const qa = document.getElementById('quickActions');
  if (qa) qa.remove();
}

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
}

// ── Send ──────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('textInput');
  const text  = input.value.trim();
  if (!text || COACH.isProcessing) return;

  removeQuickActions();
  input.value = '';
  input.style.height = 'auto';
  updateSendBtn();

  addMessage('user', text);
  await processMessage(text);
}

function showQuickActionsV2(actions) {
  var existingQA = document.getElementById('quickActionsV2');
  if (existingQA) existingQA.remove();
  var container = document.createElement('div');
  container.id = 'quickActionsV2';
  container.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;padding:8px 16px 0;';
  actions.forEach(function(action) {
    var btn = document.createElement('a');
    btn.href = action.route || '#';
    if (btn) btn.textContent = action.label;
    btn.style.cssText = 'padding:7px 13px;border-radius:20px;border:1px solid rgba(167,139,250,.3);background:rgba(139,92,246,.1);color:#ddd6fe;font-family:Outfit,sans-serif;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer;transition:all .18s;display:inline-block;';
    btn.onclick = function(e) {
      if (window.AF) AF.track('arju_quick_action_clicked', { label: action.label, type: action.type });
    };
    container.appendChild(btn);
  });
  var chatEl = document.getElementById('chat');
  if (chatEl) chatEl.appendChild(container);
}

async function sendQuick(text) {
  removeQuickActions();
  addMessage('user', text);
  await processMessage(text);
}

async function processMessage(text) {
  COACH.isProcessing = true;
  pauseMic();
  updateMicUI('thinking');
  setStatus('Arju está pensando...', 'processing');
  document.getElementById('sendBtn').classList.remove('active');

  addMessage('assistant', '', true); // typing

  try {
    // V2: context-aware mode detection
    var ctx = window.getArjuContext ? getArjuContext() : {};
    var detectedMode = window.detectArjuMode ? detectArjuMode(ctx) : 'daily_coach';
    // Check for keyword overrides
    var textL = text.toLowerCase();
    if (textL.includes('receta') || textL.includes('cocinar') || textL.includes('comer')) detectedMode = 'recipe_coach';
    if (textL.includes('entreno') || textL.includes('ejercicio') || textL.includes('entrena')) detectedMode = 'workout_session';
    if (textL.includes('pago') || textL.includes('pagué') || textL.includes('acceso')) detectedMode = 'support_router';
    if (textL.includes('progreso') || textL.includes('avancé') || textL.includes('avance')) detectedMode = 'progress_coach';
    if (textL.includes('cerrar') || textL.includes('noche') || textL.includes('dormirme')) detectedMode = 'night_close';

    var result;
    if (window.arjuSend) {
      result = await arjuSend(text, detectedMode, ctx);
    } else {
      var reply = await AF_Coach.chat(COACH.user.id, text, COACH.history.slice(-6));
      result = { message: reply, suggestedActions: [], isFallback: false };
    }
    removeTyping();
    addMessage('assistant', result.message);
    setStatus('Listo · habla o escribe', '');
    speakCoachReply(result.message);
    // Show quick actions
    if (result.suggestedActions?.length) {
      showQuickActionsV2(result.suggestedActions.slice(0,3));
    }
    if (window.AF) AF.track('arju_message_sent', { mode: detectedMode, product: ctx.productType || '' });
  } catch (e) {
    removeTyping();
    var fallbackMsg = window.getArjuFallback ? getArjuFallback('daily_coach') : 'Vamos paso a paso. Elige una acción pequeña.';
    addMessage('assistant', fallbackMsg);
    setStatus('Error de conexión', '');
    updateMicUI('idle');
    if (window.AF_logError) AF_logError('/pages/coach.html', e.message, 'warning');
  } finally {
    COACH.isProcessing = false;
    if (!TTS.speaking) resumeMic();
  }
}

// ── Auto resize textarea ──────────────────────────
function updateSendBtn() {
  const input = document.getElementById('textInput');
  const btn   = document.getElementById('sendBtn');
  btn.classList.toggle('active', input.value.trim().length > 0);
}

document.getElementById('textInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  updateSendBtn();
  document.getElementById('inputRow').classList.add('focused');
});

document.getElementById('textInput').addEventListener('blur', () => {
  document.getElementById('inputRow').classList.remove('focused');
});

document.getElementById('textInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ── MICRÓFONO ─────────────────────────────────────
// ── TTS — Coach speaks replies ─────────────────
const TTS = {
  enabled: localStorage.getItem('af-coach-tts') !== '0', // on by default
  speaking: false,
};

function speakCoachReply(text) {
  if (!TTS.enabled) return;
  if (!window.speechSynthesis) return;
  try {
    // Stop mic while speaking (avoid feedback)
    stopListening();
    window.speechSynthesis.cancel();
    const clean = text.replace(/[\u{1F300}-\u{1FFFF}]/gu, '').replace(/\*\*/g, '').trim();
    if (!clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'es-CO'; u.rate = 0.93; u.pitch = 1; u.volume = 1;
    const voices = window.speechSynthesis.getVoices();
    const v = voices.find(x => x.lang.startsWith('es-CO'))
           || voices.find(x => x.lang.startsWith('es-MX'))
           || voices.find(x => x.lang.startsWith('es-US'))
           || voices.find(x => x.lang.startsWith('es'));
    if (v) u.voice = v;
    u.onend = () => {
      TTS.speaking = false;
      // Resume mic after speaking if it was active
      if (!COACH.micPaused) setTimeout(() => startListening(), 600);
    };
    u.onerror = () => { TTS.speaking = false; };
    TTS.speaking = true;
    window.speechSynthesis.speak(u);
  } catch(e) { TTS.speaking = false; }
}

function stopSpeaking() {
  try { window.speechSynthesis?.cancel(); } catch(e) {}
  TTS.speaking = false;
}

function toggleCoachTTS() {
  TTS.enabled = !TTS.enabled;
  localStorage.setItem('af-coach-tts', TTS.enabled ? '1' : '0');
  if (!TTS.enabled) stopSpeaking();
  const btn = document.getElementById('ttsToggleBtn');
  if (btn) btn.textContent = TTS.enabled ? '🔊' : '🔇';
  showToast(TTS.enabled ? 'Voz activada' : 'Voz silenciada', 1500);
}

// Unlock audio on first user gesture (browser policy)
let _audioUnlocked = false;
function unlockAudio() {
  if (_audioUnlocked) return;
  _audioUnlocked = true;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    window.speechSynthesis?.speak(u);
    window.speechSynthesis?.cancel();
  } catch(e) {}
}

function initSpeechRecognition() {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRec) {
    COACH.speechSupported = false;
    document.getElementById('micBtn').style.opacity = '0.3';
    document.getElementById('micBtn').title = 'Micrófono no soportado en este dispositivo';
    setStatus('Escribe para hablar con tu coach');
    return;
  }

  COACH.speechSupported = true;
  const rec = new SpeechRec();
  rec.lang = 'es-CO';
  rec.continuous = false;
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  rec.onstart = () => {
    try { COACH.micActive = true; updateMicUI('listening'); setStatus('Escuchando...', 'listening'); }
    catch(e) { console.warn('[Coach] onstart error:', e.message); }
  };

  rec.onresult = (e) => {
    // Anti-self-loop: ignore if coach is speaking
    if (TTS.speaking) return;

    const interim  = Array.from(e.results).filter(r => !r.isFinal).map(r => r[0].transcript).join('');
    const final    = Array.from(e.results).filter(r => r.isFinal).map(r => r[0].transcript).join('');
    const allText  = (interim + final).toLowerCase();

    document.getElementById('interimText').textContent = interim;

    // ── Wake word "Arju" ─────────────────────────
    if (!COACH.wakeWordActive) {
      if (allText.includes('arju') || allText.includes('arjú')) {
        COACH.wakeWordActive = true;
        document.getElementById('interimText').textContent = '';
        updateMicUI('wake');
        setStatus('¿Sí? Te escucho...', 'listening');
        // Short confirmation beep via TTS
        const u = new SpeechSynthesisUtterance('Dime.');
        u.lang = 'es-MX'; u.rate = 1.1; u.volume = 0.6;
        window.speechSynthesis?.speak(u);
        // Reset wake word after 8s of silence
        clearTimeout(COACH._wakeTimer);
        COACH._wakeTimer = setTimeout(() => {
          COACH.wakeWordActive = false;
          updateMicUI('listening');
        }, 8000);
      }
      return; // ignore everything until wake word
    }

    // ── Normal message processing ─────────────────
    if (final.trim()) {
      COACH.wakeWordActive = false; // reset after message
      clearTimeout(COACH._wakeTimer);
      document.getElementById('interimText').textContent = '';
      document.getElementById('textInput').value = final;
      updateSendBtn();

      clearTimeout(COACH.silenceTimer);
      COACH.silenceTimer = setTimeout(() => {
        if (document.getElementById('textInput').value.trim()) {
          sendMessage();
        }
      }, 1200);
    }
  };

  rec.onerror = (e) => {
    const ignore = ['no-speech', 'aborted'];
    if (ignore.includes(e.error)) return;
    console.warn('Speech error:', e.error);
    if (e.error === 'not-allowed') {
      showToast('Permiso de micrófono denegado. Actívalo en configuración del navegador.', 5000);
      COACH.micPaused = true;
    }
    updateMicUI('idle');
    setStatus('Toca el micrófono para hablar');
  };

  rec.onend = () => {
    COACH.micActive = false;
    updateMicUI('idle');
    document.getElementById('interimText').textContent = '';

    // Reiniciar automáticamente si no está pausado ni procesando
    if (!COACH.micPaused && !COACH.isProcessing) {
      setTimeout(() => {
        if (!COACH.micPaused && !COACH.isProcessing) {
          startListening();
        }
      }, 800);
    }
  };

  COACH.recognition = rec;
}

function startListening() {
  if (!COACH.speechSupported || COACH.isProcessing || COACH.micPaused) return;
  try {
    COACH.recognition.start();
  } catch (e) {
    // Puede fallar si ya estaba iniciado
  }
}

function stopListening() {
  try {
    COACH.recognition?.stop();
  } catch (e) {}
  COACH.micActive = false;
  updateMicUI('idle');
}

function pauseMic() {
  COACH.micPaused = true;
  stopListening();
}

function resumeMic() {
  COACH.micPaused = false;
  if (!COACH.isProcessing) {
    setTimeout(startListening, 500);
  }
}

function toggleMic() {
  if (!COACH.speechSupported) {
    showToast('Tu navegador no soporta el micrófono. Usa Chrome en Android o Safari en iOS.');
    return;
  }

  if (COACH.micPaused) {
    // Reactivar
    COACH.micPaused = false;
    startListening();
    setStatus('Escuchando...', 'listening');
  } else {
    // Pausar
    pauseMic();
    setStatus('Micrófono pausado · Toca para reactivar');
  }
}

// ── Mic states: off / listening / wake / thinking / speaking / muted ──
const MIC_STATE_CONFIG = {
  idle:      { icon:'🎤', label:'Toca el micro o di "Arju"', glow:'rgba(255,255,255,.0)',  pulse:false },
  listening: { icon:'🎙️', label:'Escuchando...',             glow:'rgba(124,58,237,.5)',   pulse:true  },
  wake:      { icon:'✨', label:'¿Sí? Te escucho...',         glow:'rgba(16,185,129,.6)',   pulse:true  },
  thinking:  { icon:'⏳', label:'Pensando...',               glow:'rgba(245,158,11,.5)',   pulse:false },
  speaking:  { icon:'🔊', label:'Arju está hablando...',      glow:'rgba(124,58,237,.4)',   pulse:true  },
  muted:     { icon:'🔇', label:'Voz silenciada',            glow:'rgba(255,255,255,.0)',  pulse:false },
};

function updateMicUI(state) {
  const cfg = MIC_STATE_CONFIG[state] || MIC_STATE_CONFIG.idle;
  const btn = document.getElementById('micBtn');

  // Update button
  if (btn) {
    btn.className = `mic-btn state-${state}`;
    btn.textContent = cfg.icon;
    btn.style.boxShadow = cfg.glow !== 'rgba(255,255,255,.0)'
      ? `0 0 20px ${cfg.glow}, 0 0 0 1px ${cfg.glow}`
      : '';
  }

  // Update status bar
  const bar = document.getElementById('micStatusBar');
  if (bar) {
    if (state === 'listening' || state === 'wake') {
      bar.innerHTML = `
        <div class="mic-waves">
          ${[...Array(5)].map(() => `<div class="mic-wave"></div>`).join('')}
        </div>
        <span style="color:${state==='wake'?'#6ee7b7':'var(--accent-light)'}">
          ${cfg.label}
        </span>
      `;
    } else {
      bar.innerHTML = `<span>${cfg.label}</span>`;
    }
  }
}

// ── Anti-self-loop: pause STT when coach speaks ───
function speakCoachReply(text) {
  if (!TTS.enabled) return;
  if (!window.speechSynthesis) return;
  try {
    stopListening(); // STOP MIC while speaking
    updateMicUI('speaking');
    window.speechSynthesis.cancel();
    const clean = text.replace(/[\u{1F300}-\u{1FFFF}]/gu, '').replace(/\*\*/g, '').trim();
    if (!clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'es-CO'; u.rate = 0.93; u.pitch = 1; u.volume = 1;
    const voices = window.speechSynthesis.getVoices();
    const v = voices.find(x => x.lang.startsWith('es-CO'))
           || voices.find(x => x.lang.startsWith('es-MX'))
           || voices.find(x => x.lang.startsWith('es-US'))
           || voices.find(x => x.lang.startsWith('es'));
    if (v) u.voice = v;
    u.onend = () => {
      TTS.speaking = false;
      updateMicUI('idle');
      // Resume mic ONLY after TTS finishes (anti-self-loop)
      if (!COACH.micPaused) {
        setTimeout(() => {
          updateMicUI('listening');
          startListening();
        }, 700);
      }
    };
    u.onerror = () => { TTS.speaking = false; updateMicUI('idle'); };
    TTS.speaking = true;
    window.speechSynthesis.speak(u);
  } catch(e) { TTS.speaking = false; updateMicUI('idle'); }
}

function stopSpeaking() {
  try { window.speechSynthesis?.cancel(); } catch(e) {}
  TTS.speaking = false;
  updateMicUI('idle');
}

function toggleCoachTTS() {
  TTS.enabled = !TTS.enabled;
  localStorage.setItem('af-coach-tts', TTS.enabled ? '1' : '0');
  if (!TTS.enabled) stopSpeaking();
  const btn = document.getElementById('ttsToggleBtn');
  if (btn) btn.textContent = TTS.enabled ? '🔊' : '🔇';
  showToast(TTS.enabled ? 'Voz activada' : 'Voz silenciada', 1500);
}

// ── INIT ──────────────────────────────────────────
async function initCoach() {
  let _sb = null;
  try {
    _sb = window.sb || window.supabase?.createClient(
      'https://egswsqymkxmbtcpnozcq.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnc3dzcXlta3htYnRjcG5vemNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMjAzODIsImV4cCI6MjA5Mjg5NjM4Mn0.yIcQ7c4QF8wv0Dvtvaien5e-gi12CiruOBbYTeQRusM',
      { auth: { persistSession: true, storageKey: 'arjunafit-auth' } }
    );
  } catch(e) {}

  // Timeout — loader nunca queda colgado
  const _ldrT = setTimeout(() => {
    document.getElementById('pageLoader').classList.add('hide');
    addMessage('assistant', 'Hola, soy Arjuna. ¿En qué te ayudo hoy?');
    addQuickActions();
  }, 5000);

  try {
    if (!_sb) throw new Error('no sb');
    const { data: { session } } = await Promise.race([
      _sb.auth.getSession(),
      new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 4000))
    ]);
    if (!session?.user) { window.location.replace('/'); return; }
    COACH.user = session.user;
    clearTimeout(_ldrT);

    // Cargar perfil para saludo contextual
    const { data: profile } = await _sb
      .from('profiles')
      .select('nombre, reto, workout_day_num, streak_current')
      .eq('id', session.user.id)
      .maybeSingle();

    const nombre = profile?.nombre || session.user.email?.split('@')[0] || 'amiga';
    const streak = profile?.streak_current || 0;
    const weekNum = profile?.workout_day_num ? Math.ceil(profile.workout_day_num / 3) : 1;
    const reto = profile?.reto || 'glúteos';

    // Saludo SIEMPRE contextual al abrir
    // Check if arrived from a notification
    var _fromNotif = localStorage.getItem('af-notif-from');
    if (_fromNotif) {
      localStorage.removeItem('af-notif-from');
      var _notifGreets = { log_meal:'Todavía no registraste comida. Podemos empezar simple ahora mismo.', start_workout:'Tu entreno está listo. ¿Empezamos con el calentamiento?', close_day:'Ayúdame a cerrar bien el día. ¿Qué rescatamos de hoy?', return_after_absence:'Qué bueno verte de nuevo. Retomamos sin castigarnos.', trial_low_activity:'Tu prueba sigue activa. Podemos aprovechar lo que queda.' };
      var _notifMsg = _notifGreets[_fromNotif];
      if (_notifMsg) { addMessage('arju', _notifMsg); addQuickActions(); return; }
    }

    const greetings = [
      `Hola ${nombre} 👋 Semana ${weekNum} del reto. ${streak > 0 ? `Llevas ${streak} días de racha — sigue así.` : 'Hoy es un buen día para empezar tu racha.'} ¿En qué te ayudo?`,
      `Bienvenida ${nombre} ✨ Estás en semana ${weekNum}. ${streak > 0 ? `🔥 ${streak} días seguidos.` : 'Sin racha aún — ¿entrenamos hoy?'} ¿Qué necesitas?`,
    ];
    const greeting = greetings[Math.floor(Math.random() * greetings.length)];

    // Historial reciente
    let history = [];
    try {
      const { data: h } = await _sb
        .from('ai_conversations')
        .select('role, content, created_at')
        .eq('user_id', session.user.id)
        .in('role', ['user', 'assistant'])
        .order('created_at', { ascending: false })
        .limit(8);
      history = (h || []).reverse();
    } catch(e) {}

    if (history.length > 0) {
      history.forEach(m => addMessage(m.role === 'user' ? 'user' : 'assistant', m.content));
    }

    // Saludo siempre al abrir (aunque haya historial)
    addMessage('assistant', greeting);
    // 🗣️ Speak greeting after short delay (needs user gesture first)
    setTimeout(() => speakCoachReply(greeting), 800);
    addQuickActions();

    document.getElementById('pageLoader').classList.add('hide');

    // Micrófono
    initSpeechRecognition();
    if (COACH.speechSupported) {
      setTimeout(() => {
        navigator.mediaDevices?.getUserMedia({ audio: true })
          .then(() => {
            showToast('🎤 Micrófono activo · Habla cuando quieras', 2500);
            setTimeout(startListening, 500);
          })
          .catch(() => {
            setStatus('Escribe para hablar con tu coach');
          });
      }, 800);
    }

  } catch (e) {
    clearTimeout(_ldrT);
    console.error('Coach init error:', e);
    document.getElementById('pageLoader').classList.add('hide');
    addMessage('assistant', 'Hola, soy tu Coach Arjuna. ¿En qué te puedo ayudar hoy?');
    addQuickActions();
  }
}

initCoach();

<script>
function afNavRegister() {
  var btn = document.getElementById('af-reg-btn');
  var ripple = document.getElementById('af-ripple');
  btn.style.animation = 'none';
  btn.style.transform = 'scale(.88) rotate(-8deg)';
  setTimeout(function(){ btn.style.transform='scale(1.08) rotate(4deg)'; }, 120);
  setTimeout(function(){ btn.style.transform=''; btn.style.animation='nav-pulse 3s ease-in-out infinite'; }, 300);
  if (ripple) {
    for (var i=0;i<3;i++) {
      (function(d){ setTimeout(function(){
        var r=document.createElement('div');
        r.style.cssText='position:absolute;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.3);top:50%;left:50%;animation:nav-ripple .6s ease-out forwards';
        ripple.appendChild(r); setTimeout(function(){ r.remove(); },700);
      },d); })(i*80);
    }
  }
  setTimeout(function(){
    if(typeof openCamera==='function') openCamera();
    else window.location.href='/pages/nutrition.html?camera=1';
  },150);
}

// ── Active page — por ID, limpia todo primero ──────────
(function(){
  var path = window.location.pathname;
  var MAP = {
    'dashboard': { id:'nav-inicio', color:'#a78bfa', glow:'rgba(124,58,237,.5)' },
    'workout':   { id:'nav-entrena', color:'#c4b5fd', glow:'rgba(139,92,246,.5)' },
    'coach':     { id:'nav-coach',   color:'#93c5fd', glow:'rgba(59,130,246,.5)' },
    'nutrition': { id:'nav-nutr',    color:'#6ee7b7', glow:'rgba(16,185,129,.5)' },
  };
  var match = Object.keys(MAP).find(function(k){ return path.includes(k); });
  if (!match) return;
  var cfg = MAP[match];
  var el = document.getElementById(cfg.id);
  if (!el) return;
  var svg = el.querySelector('svg');
  var lbl = el.querySelector('span');
  var dot = el.querySelectorAll('div');
  if (svg) svg.setAttribute('stroke', cfg.color);
  if (lbl) { lbl.style.color=cfg.color; lbl.style.fontWeight='800'; }
  if (dot.length) { var d=dot[dot.length-1]; d.style.background=cfg.glow; d.style.boxShadow='0 0 6px '+cfg.glow; }
})();
</script>
